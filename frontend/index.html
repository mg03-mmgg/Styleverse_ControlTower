/* ==========================================================================
   FINAL LAYER · PwC executive control tower
   Palette, card system, spacing, typography, states. Loaded last.
   ========================================================================== */

:root {
  color-scheme: light;

  /* approved palette */
  --pwc-black: #1A1A1A;
  --pwc-orange: #D04A02;
  --pwc-burnt: #9C3600;
  --pwc-amber: #EB8C00;
  --pwc-gold: #C9A227;
  --pwc-brick: #E0301E;
  --pwc-deepred: #A31A12;
  --pwc-magenta: #C6007E;
  --pwc-positive: #8A6D1F;

  --paper: #F7F5F2;
  --surface: #FFFFFF;
  --surface-soft: #FBF8F4;
  --surface-tint: #FDF2E9;
  --ink: #1A1A1A;
  --muted: #4F4A44;
  --quiet: #7C766D;
  --rule: #E0D9CF;
  --rule-soft: #EEE8DF;

  --primary-purple: #D04A02;
  --purple-soft: #FDF2E9;
  --purple-deep: #9C3600;
  --red: #E0301E;
  --red-soft: #FDECEA;
  --amber: #EB8C00;
  --amber-soft: #FDF3E3;
  --green: #8A6D1F;
  --green-soft: #FAF4E2;
  --blue: #46423C;
  --blue-soft: #F1EEE9;
  --violet: #C6007E;
  --graphite: #6B655C;

  --radius-card: 6px;
  --radius-control: 5px;
  --card-border: 1px solid #E0D9CF;
  --card-shadow: 0 1px 2px rgba(26, 26, 26, 0.04);
  --sidebar-width: 268px;

  --gap-block: 22px;
  --gap-section: 34px;
}

body, .app-shell, .main-shell { background: var(--paper) !important; color: var(--ink) !important; }
.content { background: var(--paper) !important; padding: 24px 28px 60px !important; }

::-webkit-scrollbar { width: 11px; height: 11px; background: var(--paper); }
::-webkit-scrollbar-thumb { background: #C9C1B6; border: 3px solid var(--paper); border-radius: 8px; }
* { scrollbar-color: #C9C1B6 var(--paper); }

/* ---------------------------------------------------------- typography -- */

body, .content, .ws-table, .taxo-table, table { font-family: var(--font-sans); }

.page-title { font-size: 21px !important; font-weight: 700 !important; letter-spacing: -0.015em; color: var(--ink) !important; }
.page-kicker { font-size: 10px !important; font-weight: 700 !important; letter-spacing: 0.14em; color: var(--pwc-orange) !important; }
.page-sub, .page-subtitle { color: var(--muted) !important; font-size: 12.5px !important; }

.section-head h3, .page-section-title { font-size: 15px !important; font-weight: 700 !important; color: var(--ink) !important; letter-spacing: -0.01em; }
.section-head p, .page-section-header p { font-size: 12px !important; color: var(--muted) !important; line-height: 1.5; }
.rule-panel > h4, .viz-card > h4 { font-size: 13px !important; font-weight: 700 !important; color: var(--ink) !important; }
.rule-panel > p, .viz-card > p { font-size: 11.5px !important; color: var(--muted) !important; line-height: 1.5; }
.count-note { font-size: 10.5px !important; font-weight: 600 !important; color: var(--muted) !important; background: var(--surface-soft); border: 1px solid var(--rule); border-radius: 999px; padding: 3px 10px; }
.mono, .mono-pill, .provenance-hash { font-family: var(--font-mono); }
.eyebrow, .nav-label, .metric-label, .ws-control-label { letter-spacing: 0.1em !important; }

/* ------------------------------------------------------------ one card -- */

.rule-panel, .viz-card, .evidence-sheet, .record, .ws-gate, .wave-card, .brief-sheet,
.ws-table-wrap, .stage-flow, .loop-grid, .inspector, .trend-card, .cap-chart, .dq-list,
.metric-cell, .ws-headline-cell, .board-wrap, .chart-frame {
  background: var(--surface) !important;
  border: var(--card-border) !important;
  border-radius: var(--radius-card) !important;
  box-shadow: var(--card-shadow) !important;
}

.rule-panel, .viz-card, .ws-gate, .record, .cap-chart { padding: 20px 22px !important; }
.chart-frame { padding: 16px 14px !important; }

.rule-panel > h4:first-child::before, .viz-card > h4:first-child::before { background: var(--pwc-orange) !important; }

/* --------------------------------------------------------- KPI blocks --- */

.ws-headline, .metric-ledger {
  display: grid !important;
  gap: 14px !important;
  background: transparent !important;
  border: 0 !important;
  box-shadow: none !important;
  margin-bottom: var(--gap-block) !important;
}

.ws-headline-cell, .metric-cell { padding: 16px 18px !important; border-top: 3px solid var(--pwc-black) !important; }
.ws-headline-cell:first-child, .metric-cell:first-child { border-top-color: var(--pwc-orange) !important; }
.ws-headline-cell:nth-child(2), .metric-cell:nth-child(2) { border-top-color: var(--pwc-brick) !important; }
.ws-headline-cell:nth-child(3), .metric-cell:nth-child(3) { border-top-color: var(--pwc-amber) !important; }
.ws-headline-cell:nth-child(4), .metric-cell:nth-child(4) { border-top-color: var(--pwc-gold) !important; }
.ws-headline-cell:nth-child(5), .metric-cell:nth-child(5) { border-top-color: var(--pwc-positive) !important; }

.metric-label { font-size: 9.5px !important; font-weight: 700 !important; color: var(--quiet) !important; }
.metric-value { font-size: 23px !important; font-weight: 700 !important; color: var(--ink) !important; letter-spacing: -0.02em; }
.metric-value.pass { color: var(--pwc-positive) !important; }
.metric-value.miss { color: var(--pwc-brick) !important; }
.metric-meta { font-size: 11px !important; color: var(--muted) !important; }

/* ------------------------------------------------------------ spacing -- */

.page-section { margin-bottom: var(--gap-section) !important; }
.page-grid-2, .page-grid-3, .viz-grid, .packet-grid, .summary-grid { gap: var(--gap-block) !important; margin-bottom: var(--gap-section) !important; }
.section-head, .page-section-header { margin-bottom: 14px !important; padding-bottom: 10px; border-bottom: 1px solid var(--rule-soft); }
.readout { margin-top: 14px !important; padding: 12px 14px !important; background: var(--surface-soft) !important; border: 1px solid var(--rule-soft) !important; border-left: 3px solid var(--pwc-amber) !important; border-radius: 0 var(--radius-control) var(--radius-control) 0 !important; font-size: 11.5px !important; color: var(--muted) !important; line-height: 1.55; }
.viz-caption { margin-top: 12px !important; padding-top: 10px !important; border-top: 1px solid var(--rule-soft) !important; font-size: 11px !important; color: var(--muted) !important; }
.assumption-note { margin-top: 18px !important; font-size: 10.5px !important; color: var(--quiet) !important; line-height: 1.55; }

/* ------------------------------------------------------------- tables -- */

.ws-table-wrap, .table-scroll, .docket-wrap { overflow-x: auto !important; }
table { width: 100%; border-collapse: collapse; }
.ws-table th, .taxo-table th, .table-scroll th, table th {
  padding: 11px 14px !important;
  background: var(--surface-soft) !important;
  border-bottom: 1.5px solid var(--rule) !important;
  font-size: 10px !important;
  font-weight: 700 !important;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted) !important;
  text-align: left;
  white-space: nowrap;
}
.ws-table td, .taxo-table td, .table-scroll td, table td {
  padding: 12px 14px !important;
  border-bottom: 1px solid var(--rule-soft) !important;
  font-size: 12px !important;
  color: var(--muted) !important;
  line-height: 1.5;
}
.ws-table td strong, table td strong { color: var(--ink) !important; font-weight: 650 !important; }
.ws-table tbody tr:hover, table tbody tr:hover { background: var(--surface-soft) !important; }
td.value, td.quantity, .value, .cap-figure strong { font-family: var(--font-mono); text-align: right; }
.ws-table tbody tr:last-child td { border-bottom: none !important; }

/* ------------------------------------------------------ decision rows -- */

.dq-list { padding: 4px 0 !important; }
.dq-head, .dq-row {
  display: grid;
  grid-template-columns: 34px 132px minmax(150px, 1.4fr) minmax(180px, 2fr) 104px 104px 150px;
  gap: 14px;
  align-items: center;
}
.dq-head {
  padding: 11px 18px;
  border-bottom: 1.5px solid var(--rule);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
.dq-row {
  padding: 13px 18px;
  border-bottom: 1px solid var(--rule-soft);
  border-left: 3px solid transparent;
  cursor: pointer;
  transition: background 0.12s ease, border-color 0.12s ease;
}
.dq-row:last-child { border-bottom: none; }
.dq-row:hover { background: var(--surface-soft); }
.dq-row.is-selected { background: var(--surface-tint); border-left-color: var(--pwc-orange); }
.dq-row.is-decided { opacity: 0.72; }
.dq-row:focus-visible { outline: 2px solid var(--pwc-orange); outline-offset: -2px; }

.dq-rank { font-family: var(--font-mono); font-size: 11px; color: var(--quiet); }
.dq-tag { display: flex; flex-direction: column; gap: 5px; align-items: flex-start; }
.tag {
  display: inline-block;
  padding: 3px 9px;
  border-radius: 3px;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.02em;
  color: #FFFFFF;
  background: var(--pwc-black);
  white-space: nowrap;
}
.tag-replenish { background: var(--pwc-orange); }
.tag-transfer { background: #2D2A26; }
.tag-recut { background: var(--pwc-magenta); }
.tag-markdown { background: #E8B34A; color: #1A1A1A; }
.tag-escalate { background: #7A0F0A; }

.state-pill {
  display: inline-block;
  padding: 2px 8px;
  border: 1px solid var(--rule);
  border-radius: 3px;
  background: var(--surface-soft);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap;
}
.state-pill.state-OUT { border-color: #7A0F0A; color: #7A0F0A; background: #F8E9E7; }
.state-pill.state-BLOCKED { border-color: #2D2A26; color: #2D2A26; background: #EDEAE6; }
.state-pill.state-RISK { border-color: var(--pwc-brick); color: var(--pwc-brick); background: #FDECEA; }
.state-pill.state-IMBAL { border-color: #A8871B; color: #6E570D; background: #FAF2D9; }
.state-pill.state-TERMINAL { border-color: #8A1E52; color: #8A1E52; background: #FBE9F1; }
.state-pill.state-SLOW { border-color: #C08A20; color: #6E4E05; background: #FBF0D9; }
.state-pill.state-BREAKOUT { border-color: var(--pwc-magenta); color: var(--pwc-magenta); background: #FDECF5; }

.dq-item strong { display: block; font-size: 12.5px; font-weight: 650; color: var(--ink); }
.dq-meta { display: block; margin-top: 3px; font-size: 10.5px; color: var(--quiet); }
.dq-reason { font-size: 11.5px; color: var(--muted); line-height: 1.5; }
.dq-value strong, .dq-qty strong { display: block; font-family: var(--font-mono); font-size: 12.5px; font-weight: 700; color: var(--ink); }
.dq-value span, .dq-qty span { display: block; margin-top: 2px; font-size: 9.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--quiet); }
.dq-actions { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }

.btn-accept, .btn-reject {
  padding: 7px 14px;
  border-radius: var(--radius-control);
  font-family: var(--font-sans);
  font-size: 11.5px;
  font-weight: 650;
  cursor: pointer;
  transition: background 0.12s ease, color 0.12s ease;
}
.btn-accept { border: 1px solid var(--pwc-orange); background: var(--pwc-orange); color: #FFFFFF; }
.btn-accept:hover { background: var(--pwc-burnt); border-color: var(--pwc-burnt); }
.btn-reject { border: 1px solid var(--rule); background: var(--surface); color: var(--muted); }
.btn-reject:hover { border-color: var(--pwc-brick); color: var(--pwc-brick); }

.dq-done { display: inline-flex; align-items: center; gap: 5px; padding: 5px 11px; border-radius: 3px; font-size: 11px; font-weight: 700; }
.dq-done.is-accept { background: #FAF4E2; color: var(--pwc-positive); border: 1px solid #E4D9B4; }
.dq-done.is-reject { background: #FDECEA; color: var(--pwc-deepred); border: 1px solid #F2CFCA; }
.dq-time { font-size: 10.5px; color: var(--quiet); }

.dq-log .dq-row { grid-template-columns: 124px minmax(150px, 1.6fr) 110px minmax(180px, 1fr); cursor: default; }
.dq-log .dq-row:hover { background: transparent; }

/* --------------------------------------------------------- state board -- */

.state-cell, .board-cell { border-radius: 3px !important; font-weight: 650 !important; }
.state-cell.state-OUT, .board-cell.state-OUT { background: #7A0F0A !important; color: #FFFFFF !important; }
.state-cell.state-BLOCKED, .board-cell.state-BLOCKED { background: #2D2A26 !important; color: #FFFFFF !important; }
.state-cell.state-RISK, .board-cell.state-RISK { background: #E0301E !important; color: #FFFFFF !important; }
.state-cell.state-TERMINAL, .board-cell.state-TERMINAL { background: #9C3600 !important; color: #FFFFFF !important; }
.state-cell.state-IMBAL, .board-cell.state-IMBAL { background: #C9A227 !important; color: #1A1A1A !important; }
.state-cell.state-SLOW, .board-cell.state-SLOW { background: #F2D492 !important; color: #1A1A1A !important; }
.state-cell.state-BREAKOUT, .board-cell.state-BREAKOUT { background: #C6007E !important; color: #FFFFFF !important; }
.state-cell.state-HEALTHY, .board-cell.state-HEALTHY { background: #BDB5A9 !important; color: #1A1A1A !important; }
.state-cell.quiet { color: #1A1A1A !important; opacity: 0.45; }
.state-cell:hover, .board-cell:hover { outline: 2px solid var(--pwc-black); outline-offset: -2px; }

.legend, .viz-legend, .split-legend, .chart-note, .board-legend {
  display: flex; flex-wrap: wrap; gap: 8px 16px;
  margin-top: 12px; font-size: 11px; color: var(--muted);
}
.legend-item, .viz-legend span, .split-legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend-dot, .viz-legend i, .split-legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

/* -------------------------------------------------------- supply visual -- */

.cap-chart { display: grid; gap: 12px; }
.cap-row { display: grid; grid-template-columns: minmax(150px, 1.1fr) minmax(200px, 3fr) 82px 120px; gap: 16px; align-items: center; }
.cap-name strong { display: block; font-size: 12.5px; color: var(--ink); }
.cap-name span { display: block; margin-top: 2px; font-size: 10.5px; color: var(--quiet); }
.cap-track { display: flex; height: 26px; border: 1px solid var(--rule); border-radius: 3px; overflow: hidden; background: var(--surface-soft); }
.cap-seg { height: 100%; }
.cap-committed { background: var(--pwc-orange); }
.cap-free { background: #EFEAE1; }
.cap-short { background: #C6007E; }
.cap-figure strong { font-size: 14px; font-weight: 700; color: var(--ink); }
.cap-figure strong.is-pressure { color: var(--pwc-deepred); }
.cap-figure span { display: block; font-size: 9.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--quiet); }
.cap-pill-ok { border-color: var(--rule); color: var(--muted); }
.cap-pill-tight { border-color: var(--pwc-amber); color: #8A5200; background: #FDF3E3; }
.cap-pill-short { border-color: var(--pwc-deepred); color: var(--pwc-deepred); background: #FBEDEB; }
.cap-axis { display: flex; justify-content: space-between; padding-top: 8px; border-top: 1px solid var(--rule-soft); font-family: var(--font-mono); font-size: 10px; color: var(--quiet); }

/* ------------------------------------------------------------ sidebar -- */

.sidebar {
  width: var(--sidebar-width) !important;
  flex: 0 0 var(--sidebar-width) !important;
  background: #FFFFFF !important;
  border-right: 1px solid var(--rule) !important;
  overflow-y: auto;
}
.brand-mark { background: var(--pwc-orange) !important; color: #FFFFFF !important; border: 0 !important; }
.brand-name { color: var(--ink) !important; font-weight: 700 !important; }
.brand-sub { color: var(--quiet) !important; }
.nav-label { font-size: 9.5px !important; font-weight: 700 !important; color: var(--quiet) !important; text-transform: uppercase; }
.nav-item { color: var(--muted) !important; border-radius: var(--radius-control) !important; font-size: 12.5px !important; }
.nav-item i { color: var(--quiet) !important; }
.nav-item:hover { background: var(--surface-soft) !important; color: var(--ink) !important; }
.nav-item:hover i { color: var(--pwc-orange) !important; }
.nav-item.active { background: var(--surface-tint) !important; color: var(--pwc-burnt) !important; font-weight: 650 !important; border-left: 3px solid var(--pwc-orange) !important; }
.nav-item.active i { color: var(--pwc-orange) !important; }
.nav-count { background: var(--pwc-orange) !important; color: #FFFFFF !important; border-radius: 999px; padding: 1px 7px; font-size: 10px; font-weight: 700; }

.sidebar-controls { margin: 16px 0 0; }
.sidebar-controls .scenario-rail, .sidebar-controls .ws-rail {
  border: 1px solid var(--rule) !important;
  border-radius: var(--radius-card) !important;
  background: var(--surface-soft) !important;
  padding: 14px 13px !important;
  box-shadow: none !important;
}
.scenario-rail h2, .ws-rail h2 { font-size: 11.5px !important; font-weight: 700 !important; color: var(--ink) !important; text-transform: none; }
.scenario-rail p, .ws-rail p { font-size: 10.5px !important; color: var(--quiet) !important; }
.lever-row { margin-top: 12px; }
.lever-top span { font-size: 11px !important; color: var(--muted) !important; }
.lever-top strong { font-family: var(--font-mono); font-size: 11.5px !important; color: var(--pwc-burnt) !important; }
input[type="range"] { accent-color: var(--pwc-orange); width: 100%; }
.presets { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--rule); }
.presets-label { font-size: 9.5px !important; font-weight: 700 !important; letter-spacing: 0.1em; text-transform: uppercase; color: var(--quiet) !important; margin-bottom: 9px; }
.preset {
  display: block; width: 100%; text-align: left;
  margin-bottom: 7px; padding: 9px 11px;
  border: 1px solid var(--rule) !important;
  border-radius: var(--radius-control) !important;
  background: var(--surface) !important;
  cursor: pointer;
}
.preset strong { display: block; font-size: 11.5px; color: var(--ink); }
.preset span { display: block; margin-top: 2px; font-size: 10px; color: var(--quiet); line-height: 1.4; }
.preset:hover { border-color: var(--pwc-amber) !important; }
.preset.active { background: var(--surface-tint) !important; border-color: var(--pwc-orange) !important; box-shadow: inset 3px 0 0 var(--pwc-orange); }
.preset.active strong { color: var(--pwc-burnt); }
.sidebar-nav { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--rule); }
.nav-group + .nav-group { padding-top: 16px !important; }

/* ------------------------------------------------------------- topbar -- */

.topbar { background: #FFFFFF !important; border-bottom: 1px solid var(--rule) !important; }
.refresh-notice { border: 1px solid var(--rule) !important; border-left: 3px solid var(--pwc-amber) !important; background: var(--surface-soft) !important; border-radius: var(--radius-control) !important; font-size: 11.5px; color: var(--muted); margin-bottom: var(--gap-block); }

/* ------------------------------------------------------------ buttons -- */

.primary-btn { background: var(--pwc-orange) !important; border: 1px solid var(--pwc-orange) !important; color: #FFFFFF !important; border-radius: var(--radius-control) !important; font-weight: 650 !important; }
.primary-btn:hover:not([disabled]) { background: var(--pwc-burnt) !important; border-color: var(--pwc-burnt) !important; }
.primary-btn.accepted { background: var(--pwc-positive) !important; border-color: var(--pwc-positive) !important; }
.primary-btn.rejected { background: var(--pwc-deepred) !important; border-color: var(--pwc-deepred) !important; }
.secondary-btn { background: var(--surface) !important; border: 1px solid var(--rule) !important; color: var(--muted) !important; border-radius: var(--radius-control) !important; }
.secondary-btn:hover { border-color: var(--pwc-brick) !important; color: var(--pwc-brick) !important; }





.alloc-fill, .rank-fill.fit, .cyc-fill, .stage-bar-fill.after, .split-seg:first-child { background: var(--pwc-orange) !important; }

/* --------------------------------------------------------- responsive -- */

@media (max-width: 1180px) {
  .dq-head { display: none; }
  .dq-row { grid-template-columns: 30px 120px minmax(140px, 1fr) 100px 140px; row-gap: 10px; }
  .dq-reason { grid-column: 1 / -1; }
  .dq-qty { display: none; }
  .cap-row { grid-template-columns: minmax(130px, 1fr) minmax(160px, 2fr) 72px; }
  .cap-status { grid-column: 2 / -1; }
}

@media (max-width: 900px) {
  .content { padding: 18px 16px 48px !important; }
  .dq-row { grid-template-columns: 1fr 1fr; }
  .dq-rank { display: none; }
  .dq-actions { justify-content: flex-start; }
  .cap-row { grid-template-columns: 1fr; row-gap: 8px; }
  .page-grid-2, .page-grid-3, .viz-grid { grid-template-columns: 1fr !important; }
  .ws-headline, .metric-ledger { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)) !important; }
}



/* ==========================================================================
   LIVE IMPACT STRIP · recalculates with the levers and with every decision
   ========================================================================== */

.istrip {
  position: sticky;
  top: 0;
  z-index: 8;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 1px;
  margin: -24px -28px 24px;
  padding: 0;
  background: var(--rule);
  border-bottom: 1px solid var(--rule);
}

.istrip-cell {
  background: #FFFFFF;
  padding: 13px 18px;
  border-top: 3px solid var(--pwc-black);
}

.istrip-cell.tone-risk { border-top-color: var(--pwc-brick); }
.istrip-cell.tone-warn { border-top-color: var(--pwc-amber); }
.istrip-cell.tone-neutral { border-top-color: var(--pwc-black); }
.istrip-cell.tone-recovered { border-top-color: var(--pwc-positive); }

.istrip-label {
  display: block;
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--quiet);
}

.istrip-value {
  display: block;
  margin: 4px 0 2px;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--ink);
}

.tone-risk .istrip-value { color: var(--pwc-brick); }
.tone-warn .istrip-value { color: var(--pwc-burnt); }
.tone-recovered .istrip-value { color: var(--pwc-positive); }

.istrip-meta { display: block; font-size: 10.5px; color: var(--muted); }

.istrip-note {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 7px 18px;
  background: var(--surface-soft);
  font-size: 10.5px;
  color: var(--quiet);
}

/* ------------------------------------------------- clipping and overflow -- */

.dq-list, .dq-log { overflow-x: auto; }
.dq-head, .dq-row { min-width: 940px; }
.dq-log .dq-row { min-width: 620px; }
.dq-item strong, .dq-reason, .cap-name strong { overflow-wrap: anywhere; }
.dq-value, .dq-qty { white-space: nowrap; }

.dashboard-card, .rule-panel, .viz-card, .record { min-width: 0; overflow: visible; }
.dashboard-card svg, .rule-panel svg, .viz-card svg, .chart-frame svg { max-width: 100%; height: auto; }
.executive-dashboard-grid, .page-grid-2, .page-grid-3, .viz-grid { min-width: 0; }
.executive-dashboard-grid > *, .page-grid-2 > *, .page-grid-3 > * { min-width: 0; }
table { table-layout: auto; }
td, th { overflow-wrap: anywhere; }

/* collapsible rails, both of them */

.scenario-rail.is-collapsed .scenario-rail-body,
.ws-rail.is-collapsed .scenario-rail-body { display: none; }

.scenario-rail-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}

.scenario-toggle {
  flex: 0 0 auto;
  width: 26px;
  height: 26px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--rule);
  border-radius: 50%;
  background: #FFFFFF;
  color: var(--pwc-orange);
  cursor: pointer;
}

.scenario-toggle:hover { border-color: var(--pwc-orange); background: var(--surface-tint); }

/* mini legend dots must stay distinguishable */

.dashboard-mini-legend i, .legend-dot { border: 1px solid rgba(26, 26, 26, 0.18); }

@media (max-width: 1180px) {
  .istrip { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

@media (max-width: 900px) {
  .istrip { grid-template-columns: repeat(2, minmax(0, 1fr)); margin: -18px -16px 18px; position: static; }
}



/* ==========================================================================
   TYPEFACES · Times New Roman for headings, Garamond for everything else
   ========================================================================== */

:root {
  --font-head: "Times New Roman", Times, "Liberation Serif", serif;
  --font-sans: "EB Garamond", Garamond, "Adobe Garamond Pro", "Palatino Linotype", "Times New Roman", serif;
  --font-body: var(--font-sans);
}

body, .content, input, button, select, textarea,
.nav-item, .dq-row, .dq-head, table, th, td, p, span, div, li, strong, em, label {
  font-family: var(--font-sans);
}

h1, h2, h3, h4, h5,
.page-title, .section-head h3, .page-section-title, .card-head h3,
.rule-panel > h4, .viz-card > h4, .brand-name, .metric-value, .k-value,
.istrip-value, .dashboard-bar-value, .impact-value, .inspector h3,
.evidence-title h3, .distribution-title, .dq-item strong {
  font-family: var(--font-head) !important;
  letter-spacing: 0 !important;
}

.mono, .mono-pill, .provenance-hash, .dq-rank, .dq-time, .cap-axis,
.dq-value strong, .dq-qty strong, [class*="mono"] {
  font-family: var(--font-mono) !important;
}

/* serif needs a touch more size to stay legible */
body, .content { font-size: 14px; }
.dq-item strong { font-size: 14px; }
.dq-reason, .ws-table td, table td { font-size: 13px !important; }
.metric-label, .istrip-label { font-size: 10.5px !important; letter-spacing: 0.1em !important; }
.istrip-value { font-size: 22px; }
.page-title { font-size: 23px !important; }

/* ==========================================================================
   STRIP · persistent on every tab, with movement against the opening baseline
   ========================================================================== */

.istrip { grid-template-columns: repeat(5, minmax(0, 1fr)); }

.istrip-move {
  display: block;
  margin: 2px 0 3px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
}

.istrip-move.better { color: var(--pwc-positive); }
.istrip-move.worse { color: var(--pwc-brick); }
.istrip-move.flat { color: var(--quiet); font-weight: 400; }

/* ==========================================================================
   NOTHING CLIPS, NOTHING SCROLLS SIDEWAYS
   ========================================================================== */

.dq-list, .dq-log, .ws-table-wrap, .table-scroll, .docket-wrap, .cap-chart { overflow-x: visible !important; }
.dq-head, .dq-row, .dq-log .dq-row { min-width: 0 !important; }

.dq-head, .dq-row {
  grid-template-columns: 30px 110px minmax(120px, 1.25fr) minmax(150px, 1.9fr) 86px 86px 128px;
  gap: 10px;
}

.dq-item strong, .dq-reason, .dq-meta, .cap-name strong, .position-row strong, td, th {
  overflow-wrap: anywhere;
  word-break: break-word;
  white-space: normal !important;
}

.dq-value strong, .dq-qty strong { white-space: nowrap !important; font-size: 12px; }
.dq-value span, .dq-qty span { font-size: 9px; letter-spacing: 0.04em; }
.tag { white-space: nowrap !important; font-size: 10px; padding: 3px 7px; }
.state-pill { white-space: normal !important; font-size: 9px; }
.btn-accept, .btn-reject { padding: 6px 10px; font-size: 11px; white-space: nowrap !important; }

.position-ledger .position-row {
  display: grid;
  grid-template-columns: minmax(110px, 0.85fr) minmax(0, 1.4fr);
  gap: 12px;
  align-items: start;
}

.position-row strong { text-align: left !important; font-size: 12.5px; line-height: 1.45; }
.evidence-sheet, .inspector, .record, .dashboard-card { overflow: visible !important; }
.evidence-register .evidence-value, .impact-value { white-space: normal !important; overflow-wrap: anywhere; }

@media (max-width: 1280px) {
  .dq-head { display: none; }
  .dq-row {
    grid-template-columns: 26px 104px minmax(110px, 1fr) 84px 120px;
    row-gap: 9px;
  }
  .dq-reason { grid-column: 1 / -1; }
  .dq-qty { display: none; }
}

@media (max-width: 820px) {
  .dq-row { grid-template-columns: 1fr 1fr; }
  .dq-rank { display: none; }
  .istrip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}



/* ==========================================================================
   STRIP · sits directly under the sticky topbar, never scrolls away
   ========================================================================== */

.istrip {
  position: sticky;
  top: 82px;
  z-index: 6;
  margin: -24px -28px 22px;
  border-top: 0;
  box-shadow: 0 6px 12px -10px rgba(26, 26, 24, 0.35);
}

.istrip-cell { padding: 12px 18px 13px; }
.istrip-value { margin: 3px 0 4px; }

/* movement reads as a pill, so direction is obvious at a glance */

.istrip-move {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin: 0 0 5px;
  padding: 2px 8px;
  border-radius: 3px;
  border: 1px solid transparent;
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.01em;
}

.istrip-move.better {
  color: #5E4A0F;
  background: #F7EFD6;
  border-color: #D9C88E;
}

.istrip-move.worse {
  color: #FFFFFF;
  background: var(--pwc-brick);
  border-color: var(--pwc-brick);
}

.istrip-move.flat {
  color: var(--quiet);
  background: transparent;
  border-color: var(--rule-soft);
  font-weight: 500;
}

@media (max-width: 900px) {
  .istrip { position: static; margin: -18px -16px 18px; }
}



/* ==========================================================================
   WEIGHT · Garamond and Times both read thin at UI sizes, so lift everything
   ========================================================================== */

body, .content, p, span, div, li, td, th, label, input, button, select, a,
.dq-reason, .dq-meta, .metric-meta, .istrip-meta, .cap-name span,
.section-head p, .page-section-header p, .rule-panel > p, .viz-card > p,
.readout, .viz-caption, .assumption-note, .empty-state, .nav-item, .preset span {
  font-weight: 600 !important;
}

h1, h2, h3, h4, h5, strong, b, th,
.page-title, .section-head h3, .page-section-title, .card-head h3,
.rule-panel > h4, .viz-card > h4, .metric-value, .istrip-value, .k-value,
.dq-item strong, .dq-value strong, .dq-qty strong, .dashboard-bar-value,
.tag, .state-pill, .btn-accept, .btn-reject, .dq-done, .nav-item.active,
.brand-name, .count-note, .metric-label, .istrip-label, .nav-label, .presets-label {
  font-weight: 700 !important;
}

.page-title, .card-head h3, .section-head h3, .istrip-value, .metric-value { font-weight: 700 !important; }
svg text { font-weight: 600; }
svg text[font-weight="700"] { font-weight: 700; }

/* ==========================================================================
   EXHIBITS MUST FIT THEIR CARD
   ========================================================================== */

.executive-dashboard-grid, .executive-dashboard-grid.three,
.packet-grid, .left-lower, .page-grid-2, .page-grid-3, .viz-grid, .summary-grid {
  grid-auto-columns: minmax(0, 1fr);
}

.executive-dashboard-grid > *, .packet-grid > *, .left-lower > *,
.page-grid-2 > *, .page-grid-3 > *, .viz-grid > *, .summary-grid > * {
  min-width: 0 !important;
  max-width: 100%;
}

.dashboard-card, .evidence-sheet, .rule-panel, .viz-card, .record, .inspector {
  overflow: hidden !important;
}

.chart-frame { overflow: visible !important; padding: 14px 10px !important; }
.chart-frame svg, .dashboard-card svg, .rule-panel svg, .viz-card svg {
  display: block;
  width: 100% !important;
  height: auto !important;
  max-width: 100% !important;
}

.evidence-title { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; }
.evidence-title span { font-size: 11.5px; }
.chart-note { flex-wrap: wrap; gap: 8px 16px; }

/* selected position: label left, value right, both wrapping inside the card */
.position-ledger .position-row { grid-template-columns: minmax(96px, 0.8fr) minmax(0, 1.5fr); }
.position-row strong { font-size: 12.5px; line-height: 1.5; }

/* decision rows: the Reject button was falling off the card edge */
.dq-head, .dq-row {
  grid-template-columns: 28px 104px minmax(110px, 1.1fr) minmax(140px, 1.7fr) 78px 78px 150px;
  gap: 9px;
  padding-left: 14px;
  padding-right: 14px;
}

.dq-actions { gap: 6px; }
.btn-accept, .btn-reject { padding: 6px 11px; font-size: 11px; flex: 0 0 auto; }
.dq-done { padding: 5px 9px; font-size: 10.5px; }

@media (max-width: 1360px) {
  .dq-head { display: none; }
  .dq-row {
    grid-template-columns: 26px 100px minmax(110px, 1fr) 78px 148px;
    row-gap: 9px;
  }
  .dq-reason { grid-column: 1 / -1; }
  .dq-qty { display: none; }
}

@media (max-width: 860px) {
  .dq-row { grid-template-columns: 1fr 1fr; }
  .dq-rank { display: none; }
  .dq-actions { grid-column: 1 / -1; justify-content: flex-start; }
}



/* ==========================================================================
   ONE PADDING SYSTEM · every exhibit keeps the same breathing room inside
   its own border, whatever its size. Nothing touches an edge.
   ========================================================================== */

.evidence-sheet, .record, .inspector, .dashboard-card, .rule-panel, .viz-card,
.ws-gate, .cap-chart, .brief-sheet, .wave-card, .trend-card, .distribution,
.scenario-rail, .ws-rail, .empty-state, .readout, .constraint-list {
  box-sizing: border-box;
  padding: 20px 22px !important;
}

/* shells whose rows carry their own padding stay flush, rows get the inset */
.ws-table-wrap, .stage-flow, .loop-grid, .dq-list, .board-wrap, .table-scroll,
.docket-wrap, .chart-frame {
  box-sizing: border-box;
  padding: 0 !important;
}

.dq-head, .dq-row { padding-left: 18px !important; padding-right: 18px !important; }
.ws-table th, .ws-table td, .table-scroll th, .table-scroll td, table th, table td {
  padding-left: 16px !important;
  padding-right: 16px !important;
}
.stage-row, .brand-row, .loop-step { padding-left: 18px !important; padding-right: 18px !important; }

/* a card that already sits inside a padded card must not double up */
.record .dq-list, .dashboard-card .dq-list, .rule-panel .ws-table-wrap,
.record .ws-table-wrap, .dashboard-card .ws-table-wrap {
  margin-left: -22px;
  margin-right: -22px;
  width: calc(100% + 44px);
}

.dashboard-card .chart-frame, .evidence-sheet .chart-frame, .viz-card .chart-frame {
  margin: 0;
  width: 100%;
  border: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.rule-panel .readout, .viz-card .readout, .evidence-sheet .readout,
.dashboard-card .readout, .record .readout {
  padding: 12px 14px !important;
}

.rule-panel .empty-state, .record .empty-state, .dashboard-card .empty-state {
  padding: 16px 0 !important;
}

/* headers and captions sit inside the same gutter as the body of the card */
.evidence-title, .card-head, .section-head, .page-section-header,
.position-ledger, .dashboard-bar-list, .viz-legend, .chart-note,
.legend, .kv-list, .distribution-title, .state-bar {
  padding-left: 0 !important;
  padding-right: 0 !important;
  margin-left: 0 !important;
  margin-right: 0 !important;
  max-width: 100%;
}

.evidence-title { gap: 8px 14px; }
.evidence-title h3 { flex: 1 1 auto; min-width: 0; }
.evidence-title span { flex: 0 1 auto; min-width: 0; text-align: right; overflow-wrap: anywhere; }

.card-head { flex-wrap: wrap; }
.card-head > div:first-child { min-width: 0; flex: 1 1 200px; }

/* svg exhibits keep a matching inset so axis labels never kiss the border */
.chart-frame svg, .dashboard-card > svg, .rule-panel > svg, .viz-card > svg {
  width: 100% !important;
  height: auto !important;
  padding: 2px 0;
}

/* the last row inside any card should not sit flush against the bottom edge */
.position-ledger, .kv-list, .dashboard-bar-list { margin-bottom: 0 !important; }
.position-row:last-child, .kv-row:last-child { border-bottom: 0 !important; padding-bottom: 0 !important; }

@media (max-width: 900px) {
  .evidence-sheet, .record, .inspector, .dashboard-card, .rule-panel, .viz-card,
  .ws-gate, .cap-chart, .brief-sheet, .wave-card, .trend-card {
    padding: 16px 16px !important;
  }
  .record .dq-list, .dashboard-card .dq-list {
    margin-left: -16px;
    margin-right: -16px;
    width: calc(100% + 32px);
  }
  .dq-head, .dq-row { padding-left: 14px !important; padding-right: 14px !important; }
}



/* bar tones: distinct by default, and an explicit series colour always wins */
.bar-fill { background: #6B655C; }
.bar-fill.red { background: #A31A12; }
.bar-fill.amber { background: #E8B34A; }
.bar-fill.green { background: #8A6D1F; }
.bar-fill.blue { background: #2D2A26; }
.bar-fill.graphite { background: #BDB5A9; }
.dashboard-bar-fill { background: #6B655C; }



/* bar colours, final word. An inline per-series colour still overrides these. */
.bar-list .bar-track .bar-fill { background: #6B655C; }
.bar-list .bar-track .bar-fill.red { background: #A31A12; }
.bar-list .bar-track .bar-fill.amber { background: #E8B34A; }
.bar-list .bar-track .bar-fill.green { background: #8A6D1F; }
.bar-list .bar-track .bar-fill.blue { background: #2D2A26; }
.bar-list .bar-track .bar-fill.graphite { background: #BDB5A9; }
.bar-list .bar-track .bar-fill[style*="background"] { background-image: none; }
.dashboard-bar-list .dashboard-bar-track .dashboard-bar-fill { background-image: none; }



/* ==========================================================================
   STATE BOARD · one severity ramp within the approved palette.
   Black and deep red at the severe end, gold at the mild end, and healthy
   left almost blank so the eye goes straight to what needs a decision.
   ========================================================================== */

.state-cell, .board-cell {
  border-radius: 3px !important;
  border: 1px solid rgba(255, 255, 255, 0.85) !important;
  font-weight: 700 !important;
  letter-spacing: 0.01em;
}

.state-cell.state-BLOCKED, .board-cell.state-BLOCKED { background: #1A1A1A !important; color: #FFFFFF !important; }
.state-cell.state-OUT, .board-cell.state-OUT { background: #8C1D18 !important; color: #FFFFFF !important; }
.state-cell.state-RISK, .board-cell.state-RISK { background: #E0301E !important; color: #FFFFFF !important; }
.state-cell.state-IMBAL, .board-cell.state-IMBAL { background: #D04A02 !important; color: #FFFFFF !important; }
.state-cell.state-TERMINAL, .board-cell.state-TERMINAL { background: #9C3600 !important; color: #FFFFFF !important; }
.state-cell.state-SLOW, .board-cell.state-SLOW { background: #EB8C00 !important; color: #1A1A1A !important; }
.state-cell.state-BREAKOUT, .board-cell.state-BREAKOUT { background: #FFB600 !important; color: #1A1A1A !important; }
.state-cell.state-HEALTHY, .board-cell.state-HEALTHY { background: #EFE9DF !important; color: #6B655C !important; font-weight: 600 !important; }

.state-cell:hover, .board-cell:hover { outline: 2px solid #1A1A1A; outline-offset: -2px; }
.state-cell.is-selected, .board-cell.is-selected { outline: 2px solid #1A1A1A; outline-offset: -2px; }

.state-table th { background: #FFFFFF !important; color: #4F4A44 !important; }
.state-table td { padding: 4px !important; }

/* pills follow the same ramp */
.state-pill.state-BLOCKED { border-color: #1A1A1A; color: #1A1A1A; background: #EDEAE6; }
.state-pill.state-OUT { border-color: #8C1D18; color: #8C1D18; background: #F8EAE8; }
.state-pill.state-RISK { border-color: #E0301E; color: #B3170A; background: #FDECEA; }
.state-pill.state-IMBAL { border-color: #D04A02; color: #9C3600; background: #FBEFE7; }
.state-pill.state-TERMINAL { border-color: #9C3600; color: #7A2A00; background: #F9EDE4; }
.state-pill.state-SLOW { border-color: #EB8C00; color: #8A5200; background: #FDF3E3; }
.state-pill.state-BREAKOUT { border-color: #C98F00; color: #7A5600; background: #FFF6DF; }
.state-pill.state-HEALTHY { border-color: #DCD5C9; color: #6B655C; background: #F7F3EC; }

/* the network mix bar and its legend inherit the same ramp */
.state-bar { background: #EFE9DF !important; }
.legend-dot { border: 1px solid rgba(26, 26, 26, 0.14); }



/* ==========================================================================
   STATE BOARD, take two.
   Saturated blocks read as a wall of colour when one state dominates, which
   is what made the grid ugly. Cells are now light, with the state carried by
   a solid colour bar and the count set in the state's own colour.
   ========================================================================== */

.state-cell, .board-cell {
  position: relative;
  border: 1px solid #E4DED5 !important;
  border-radius: 4px !important;
  background: #FBF9F5 !important;
  color: #4F4A44 !important;
  font-weight: 700 !important;
  overflow: hidden;
  transition: background 0.12s ease, border-color 0.12s ease;
}

.state-cell::before, .board-cell::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 4px;
  background: #E4DED5;
}

.state-cell.state-OUT, .board-cell.state-OUT { background: #FBEDEB !important; border-color: #E7C3BD !important; color: #7F1D1D !important; }
.state-cell.state-OUT::before, .board-cell.state-OUT::before { background: #7F1D1D; }

.state-cell.state-BLOCKED, .board-cell.state-BLOCKED { background: #F4EFEA !important; border-color: #D8CCC1 !important; color: #4A3B2F !important; }
.state-cell.state-BLOCKED::before, .board-cell.state-BLOCKED::before { background: #1A1A1A; }

.state-cell.state-RISK, .board-cell.state-RISK { background: #FDECEA !important; border-color: #F0C6C0 !important; color: #B3170A !important; }
.state-cell.state-RISK::before, .board-cell.state-RISK::before { background: #E0301E; }

.state-cell.state-IMBAL, .board-cell.state-IMBAL { background: #FCEFE5 !important; border-color: #EFCFB6 !important; color: #9C3600 !important; }
.state-cell.state-IMBAL::before, .board-cell.state-IMBAL::before { background: #D04A02; }

.state-cell.state-TERMINAL, .board-cell.state-TERMINAL { background: #F8EEE6 !important; border-color: #E4CDB9 !important; color: #7A2A00 !important; }
.state-cell.state-TERMINAL::before, .board-cell.state-TERMINAL::before { background: #9C3600; }

.state-cell.state-SLOW, .board-cell.state-SLOW { background: #FDF5E6 !important; border-color: #EFDCB6 !important; color: #8A5200 !important; }
.state-cell.state-SLOW::before, .board-cell.state-SLOW::before { background: #EB8C00; }

.state-cell.state-BREAKOUT, .board-cell.state-BREAKOUT { background: #FFF9E4 !important; border-color: #EEDFAE !important; color: #7A5600 !important; }
.state-cell.state-BREAKOUT::before, .board-cell.state-BREAKOUT::before { background: #FFB600; }

.state-cell.state-HEALTHY, .board-cell.state-HEALTHY {
  background: #FFFFFF !important;
  border-color: #EDE7DE !important;
  color: #A9A298 !important;
  font-weight: 600 !important;
}
.state-cell.state-HEALTHY::before, .board-cell.state-HEALTHY::before { background: #EDE7DE; }

.state-cell:hover, .board-cell:hover {
  background: #FFFFFF !important;
  border-color: #1A1A1A !important;
}

.state-cell.is-selected, .board-cell.is-selected {
  border-color: #1A1A1A !important;
  box-shadow: inset 0 0 0 1px #1A1A1A;
}

.state-table td { padding: 3px !important; }
.state-table th {
  background: #FFFFFF !important;
  color: #4F4A44 !important;
  font-size: 10px !important;
  letter-spacing: 0.1em;
}



/* ==========================================================================
   STATE BOARD · single hue heat map (option D)
   White for healthy through to near black red for stocked out. Severity is
   carried by intensity, so a dominant state no longer floods the grid.
   ========================================================================== */

.state-cell, .board-cell {
  position: relative;
  border: 1px solid rgba(26, 26, 26, 0.07) !important;
  border-radius: 3px !important;
  font-weight: 700 !important;
  color: #1A1A1A !important;
  transition: box-shadow 0.12s ease, border-color 0.12s ease;
}

.state-cell::before, .board-cell::before { content: none !important; }

.state-cell.state-HEALTHY, .board-cell.state-HEALTHY { background: #FFFFFF !important; color: #C4BDB3 !important; font-weight: 600 !important; }
.state-cell.state-BREAKOUT, .board-cell.state-BREAKOUT { background: #FDEFD2 !important; color: #6B5312 !important; }
.state-cell.state-SLOW, .board-cell.state-SLOW { background: #F9D9A3 !important; color: #6B4A05 !important; }
.state-cell.state-IMBAL, .board-cell.state-IMBAL { background: #F0B27A !important; color: #5E2C05 !important; }
.state-cell.state-TERMINAL, .board-cell.state-TERMINAL { background: #E08B4A !important; color: #2A1403 !important; }
.state-cell.state-RISK, .board-cell.state-RISK { background: #CF5B22 !important; color: #FFFFFF !important; }
.state-cell.state-BLOCKED, .board-cell.state-BLOCKED { background: #A83912 !important; color: #FFFFFF !important; }
.state-cell.state-OUT, .board-cell.state-OUT { background: #7A1E0C !important; color: #FFFFFF !important; }

.state-cell:hover, .board-cell:hover { border-color: #1A1A1A !important; box-shadow: inset 0 0 0 1px #1A1A1A; }
.state-cell.is-selected, .board-cell.is-selected { border-color: #1A1A1A !important; box-shadow: inset 0 0 0 2px #1A1A1A; }

.state-table td { padding: 3px !important; }
.state-table th { background: #FFFFFF !important; color: #4F4A44 !important; font-size: 10px !important; letter-spacing: 0.1em; }

/* the legend now reads as a scale */
.board-legend, .legend { align-items: center; }
.board-legend .legend-item, .legend .legend-item { font-size: 11px; }
.legend-dot { border: 1px solid rgba(26, 26, 26, 0.16) !important; border-radius: 2px !important; }
.state-bar { background: #FFFFFF !important; border: 1px solid rgba(26, 26, 26, 0.08); }
.state-segment { border-right: 1px solid rgba(255, 255, 255, 0.6); }



/* ==========================================================================
   DECISION ROW · every column can shrink, so Accept and Reject stay inside
   the card at any width. The buttons stack before they overflow.
   ========================================================================== */

.dq-list, .dq-log { max-width: 100%; overflow: hidden !important; }

.dq-head, .dq-row {
  grid-template-columns:
    26px
    minmax(0, 104px)
    minmax(0, 1.15fr)
    minmax(0, 1.7fr)
    minmax(0, 82px)
    minmax(0, 82px)
    minmax(96px, 132px) !important;
  gap: 10px !important;
  max-width: 100%;
}

.dq-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  justify-content: flex-end;
  min-width: 0;
}

.btn-accept, .btn-reject {
  flex: 1 1 auto;
  min-width: 58px;
  max-width: 100%;
  padding: 6px 8px !important;
  font-size: 10.5px !important;
  text-align: center;
}

.dq-done { flex: 1 1 auto; justify-content: center; min-width: 0; }
.dq-value, .dq-qty { min-width: 0; }
.dq-value strong, .dq-qty strong { font-size: 11.5px; }

@media (max-width: 1500px) {
  .dq-head, .dq-row {
    grid-template-columns:
      24px
      minmax(0, 98px)
      minmax(0, 1.1fr)
      minmax(0, 1.5fr)
      minmax(0, 76px)
      minmax(88px, 118px) !important;
  }
  .dq-head span:nth-child(6), .dq-qty { display: none; }
  .btn-accept, .btn-reject { flex: 1 1 100%; }
}

@media (max-width: 1180px) {
  .dq-head { display: none; }
  .dq-row {
    grid-template-columns: 24px minmax(0, 1fr) minmax(0, 76px) minmax(92px, 120px) !important;
    row-gap: 9px;
  }
  .dq-reason { grid-column: 1 / -1; }
}

@media (max-width: 820px) {
  .dq-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) !important; }
  .dq-rank { display: none; }
  .dq-actions { grid-column: 1 / -1; justify-content: flex-start; }
  .btn-accept, .btn-reject { flex: 0 1 auto; min-width: 80px; }
}



/* ==========================================================================
   DECISION LOG · four columns of its own, not the seven-column queue template
   ========================================================================== */

.dq-log .dq-row {
  grid-template-columns:
    minmax(0, 108px)
    minmax(0, 1.6fr)
    minmax(0, 96px)
    minmax(0, 1.1fr) !important;
  gap: 14px !important;
  align-items: center;
  cursor: default;
  border-left: 3px solid transparent;
}

.dq-log .dq-row:hover { background: transparent; }
.dq-log .dq-tag { align-items: flex-start; }
.dq-log .dq-item { min-width: 0; }
.dq-log .dq-item strong { font-size: 13px; }
.dq-log .dq-value strong { font-size: 12px; }

.dq-log .dq-actions {
  display: flex;
  flex-wrap: nowrap;
  gap: 10px;
  justify-content: flex-end;
  align-items: center;
}

.dq-log .dq-done {
  flex: 0 0 auto;
  min-width: 0;
  width: auto;
  padding: 4px 12px;
  white-space: nowrap;
}

.dq-log .dq-time { flex: 0 0 auto; }

@media (max-width: 900px) {
  .dq-log .dq-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) !important; row-gap: 8px; }
  .dq-log .dq-actions { grid-column: 1 / -1; justify-content: flex-start; }
}



/* pager under the decision queue */
.dq-pager {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 16px;
  align-items: center;
  justify-content: space-between;
  margin-top: 14px;
  padding-top: 13px;
  border-top: 1px solid var(--rule);
}

.dq-pager-count { font-size: 12px; color: var(--muted); }
.dq-pager-count strong { color: var(--ink); }
.dq-pager-actions { display: flex; flex-wrap: wrap; gap: 8px; }

.pager-btn {
  padding: 7px 14px;
  border: 1px solid var(--rule);
  border-radius: var(--radius-control);
  background: #FFFFFF;
  color: var(--muted);
  font-family: var(--font-sans);
  font-size: 11.5px;
  font-weight: 700;
  cursor: pointer;
}

.pager-btn:hover { border-color: #1A1A1A; color: #1A1A1A; }
.pager-btn.primary { background: #D04A02; border-color: #D04A02; color: #FFFFFF; }
.pager-btn.primary:hover { background: #9C3600; border-color: #9C3600; color: #FFFFFF; }

</style>
</body>
</html>
