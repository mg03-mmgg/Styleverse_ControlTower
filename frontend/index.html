<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="description" content="StyleVerse Workstream 1: Trend to Design Accelerator and retail decision control tower" />
    <title>StyleVerse | Trend to Design Accelerator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Inter:wght@400;500;600;650;700&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <style>
/* ==========================================================================
   1. Control tower stylesheet (merged from styles.css)
   ========================================================================== */
:root {
  --paper: #FFFFFF;
  --surface: #FFFFFF;
  --surface-soft: rgba(208,74,2,0.035);
  --ink: #D04A02;
  --muted: rgba(208,74,2,0.78);
  --quiet: rgba(208,74,2,0.58);
  --rule: rgba(208,74,2,0.18);
  --rule-soft: rgba(208,74,2,0.10);
  --primary-purple: #D04A02;
  --purple-soft: rgba(208,74,2,0.075);
  --purple-deep: #D04A02;
  --red: #D04A02;
  --red-soft: rgba(208,74,2,0.075);
  --amber: rgba(208,74,2,0.78);
  --amber-soft: rgba(208,74,2,0.075);
  --green: #D04A02;
  --green-soft: rgba(208,74,2,0.075);
  --blue: #D04A02;
  --blue-soft: rgba(208,74,2,0.075);
  --violet: #D04A02;
  --graphite: rgba(208,74,2,0.72);
  --sidebar-width: 240px;
  --radius-control: 6px;
  --radius-card: 8px;
  --radius-inspector: 16px;
  --shadow-inspector: 0 13px 31px rgba(208,74,2,0.09);
  --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
  --space-1: 8px;
  --space-2: 16px;
  --space-3: 24px;
  --space-4: 32px;
  --space-5: 40px;
  --space-6: 48px;
  --space-7: 56px;
}

* {
  box-sizing: border-box;
}

html {
  min-width: 320px;
  background: var(--paper);
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 1.45;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}

button,
input {
  font: inherit;
}

button {
  color: inherit;
}

button:focus-visible,
input:focus-visible,
[tabindex]:focus-visible {
  outline: 2px solid var(--primary-purple);
  outline-offset: 3px;
}

button:disabled {
  cursor: not-allowed;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.mono {
  font-family: var(--font-mono);
}

.app-shell {
  display: flex;
  min-height: 100vh;
  background: var(--paper);
}

.sidebar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  flex: 0 0 var(--sidebar-width);
  flex-direction: column;
  width: var(--sidebar-width);
  height: 100vh;
  overflow-y: auto;
  padding: 24px 14px 16px;
  background: var(--surface);
  border-right: 1px solid var(--rule);
  scrollbar-width: thin;
  scrollbar-color: var(--rule) transparent;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 9px 24px;
  border-bottom: 1px solid var(--rule-soft);
}

.brand-mark {
  position: relative;
  display: grid;
  width: 31px;
  height: 31px;
  place-items: center;
  flex: 0 0 31px;
  border: 1px solid var(--ink);
  background: var(--surface);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: -0.06em;
}

.brand-mark::after {
  position: absolute;
  right: -1px;
  bottom: -4px;
  left: -1px;
  height: 2px;
  background: var(--primary-purple);
  content: "";
}

.brand-name {
  font-size: 13px;
  font-weight: 650;
  letter-spacing: -0.025em;
}

.brand-sub {
  display: block;
  margin-top: 2px;
  color: var(--quiet);
  font-size: 10px;
  letter-spacing: 0.02em;
}

.nav-group {
  padding-top: 23px;
}

.nav-label,
.rail-kicker,
.eyebrow,
.page-kicker,
.section-kicker {
  color: var(--quiet);
  font-size: 10px;
  font-weight: 650;
  letter-spacing: 0.11em;
  text-transform: uppercase;
}

.nav-label {
  padding: 0 10px 8px;
}

.nav-item {
  display: flex;
  width: 100%;
  align-items: center;
  gap: 10px;
  margin: 1px 0;
  padding: 9px 10px;
  border: 0;
  border-left: 2px solid transparent;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-size: 12px;
  text-align: left;
  transition: background 160ms ease, color 160ms ease, border-color 160ms ease;
}

.nav-item i {
  width: 18px;
  color: var(--quiet);
  font-size: 16px;
  text-align: center;
}

.nav-item:hover {
  background: var(--surface-soft);
  color: var(--ink);
}

.nav-item.active {
  border-left-color: var(--primary-purple);
  background: var(--purple-soft);
  color: var(--ink);
  font-weight: 600;
}

.nav-item.active i {
  color: var(--primary-purple);
}

.nav-count {
  margin-left: auto;
  color: var(--purple-deep);
  font-family: var(--font-mono);
  font-size: 10px;
}

.sidebar-bottom {
  margin-top: auto;
  padding-top: 14px;
  border-top: 1px solid var(--rule-soft);
}

.utility-item {
  padding-top: 8px;
  padding-bottom: 8px;
}

.profile {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-top: 14px;
  padding: 12px 9px 0;
  border-top: 1px solid var(--rule-soft);
}

.avatar {
  display: grid;
  width: 28px;
  height: 28px;
  flex: 0 0 28px;
  place-items: center;
  border-radius: 50%;
  background: var(--ink);
  color: #fff;
  font-size: 10px;
  font-weight: 600;
}

.profile strong,
.profile span {
  display: block;
}

.profile strong {
  font-size: 11px;
  font-weight: 600;
}

.profile span {
  margin-top: 1px;
  color: var(--quiet);
  font-size: 10px;
}

.scenario-rail {
  margin: 25px 8px 0;
  padding-top: 17px;
  border-top: 1px solid var(--rule);
}

.scenario-rail-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
}

.scenario-rail-head h2 {
  margin: 0;
  font-size: 12px;
  font-weight: 650;
  letter-spacing: -0.02em;
}

.scenario-rail-head p {
  margin: 3px 0 0;
  color: var(--quiet);
  font-size: 9.5px;
  line-height: 1.35;
}

.scenario-toggle {
  display: grid;
  width: 24px;
  height: 24px;
  flex: 0 0 24px;
  place-items: center;
  border: 1px solid var(--rule);
  border-radius: var(--radius-control);
  background: var(--surface);
  color: var(--muted);
  cursor: pointer;
}

.scenario-toggle:hover {
  border-color: var(--primary-purple);
  color: var(--primary-purple);
}

.scenario-rail.is-collapsed .scenario-rail-body {
  display: none;
}

.lever-row {
  padding: 11px 0;
  border-bottom: 1px solid var(--rule-soft);
}

.lever-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 7px;
  color: var(--muted);
  font-size: 10px;
}

.lever-top strong {
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  white-space: nowrap;
}

.lever-row input[type="range"] {
  width: 100%;
  height: 4px;
  accent-color: var(--primary-purple);
  cursor: pointer;
}

.presets {
  padding-top: 15px;
}

.presets-label {
  margin-bottom: 7px;
  color: var(--quiet);
  font-size: 9.5px;
  font-weight: 650;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.preset {
  display: block;
  width: 100%;
  padding: 8px 0;
  border: 0;
  border-bottom: 1px solid var(--rule-soft);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  text-align: left;
}

.preset strong,
.preset span {
  display: block;
}

.preset strong {
  color: var(--ink);
  font-size: 10.5px;
  font-weight: 600;
}

.preset span {
  margin-top: 2px;
  font-size: 9.5px;
  line-height: 1.35;
}

.preset:hover strong,
.preset.active strong {
  color: var(--primary-purple);
}

.main-shell {
  min-width: 0;
  flex: 1;
  background: var(--paper);
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  min-height: 82px;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  padding: 14px clamp(22px, 3.1vw, 42px);
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}

.page-kicker {
  margin-bottom: 4px;
  color: var(--primary-purple);
}

.page-title {
  margin: 0;
  font-size: clamp(19px, 2vw, 24px);
  font-weight: 650;
  letter-spacing: -0.045em;
  line-height: 1.15;
}

.page-subtitle {
  margin-top: 5px;
  color: var(--muted);
  font-size: 11.5px;
}

.header-actions {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  gap: 15px;
}

.mobile-nav-toggle {
  display: none;
}

.scenario-trigger {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 5px 0 4px;
  border: 0;
  border-bottom: 1px solid var(--ink);
  background: transparent;
  cursor: pointer;
  font-size: 11px;
  font-weight: 600;
}

.scenario-trigger i:first-child {
  color: var(--primary-purple);
  font-size: 15px;
}

.scenario-trigger i:last-child {
  color: var(--muted);
  font-size: 13px;
}

.updated {
  padding-left: 15px;
  border-left: 1px solid var(--rule);
  color: var(--quiet);
  font-size: 10px;
  white-space: nowrap;
}

.icon-action {
  padding: 5px;
  border: 0;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-size: 17px;
  line-height: 1;
}

.icon-action:hover {
  color: var(--primary-purple);
}

.header-profile {
  display: flex;
  align-items: center;
  gap: 7px;
  padding-left: 15px;
  border-left: 1px solid var(--rule);
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
}

.header-profile .avatar {
  width: 28px;
  height: 28px;
  background: #FFFFFF;
  color: var(--ink);
}

.content {
  width: 100%;
  max-width: 1440px;
  margin: 0 auto;
  padding: 30px clamp(22px, 3.1vw, 42px) 56px;
}

.refresh-notice,
.inline-error {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 26px;
  padding: 10px 13px;
  border: 1px solid;
  font-size: 11px;
}

.refresh-notice {
  border-color: #FFFFFF;
  background: var(--amber-soft);
  color: #D04A02;
}

.inline-error {
  border-color: #D04A02;
  background: var(--red-soft);
  color: var(--red);
}

.notice-copy {
  display: flex;
  align-items: center;
  gap: 8px;
}

.notice-copy i {
  font-size: 15px;
}

.notice-action {
  padding: 2px 0;
  border: 0;
  background: transparent;
  color: inherit;
  cursor: pointer;
  font-size: 11px;
  font-weight: 650;
  text-decoration: underline;
  text-underline-offset: 3px;
  white-space: nowrap;
}

.summary-grid {
  display: grid;
  grid-template-columns: minmax(0, 7fr) minmax(420px, 5fr);
  align-items: start;
  gap: 40px;
}

.conclusion {
  padding: 2px 0 26px;
  border-bottom: 1px solid var(--rule);
}

.eyebrow {
  margin-bottom: 13px;
  color: var(--primary-purple);
}

.conclusion h2 {
  max-width: 680px;
  margin: 0;
  font-size: clamp(25px, 2.5vw, 32px);
  font-weight: 650;
  letter-spacing: -0.055em;
  line-height: 1.08;
}

.conclusion h2 .emphasis {
  color: var(--primary-purple);
}

.conclusion p {
  max-width: 640px;
  margin: 14px 0 17px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
}

.text-link {
  color: var(--ink);
  cursor: pointer;
  font-size: 11.5px;
  font-weight: 600;
  text-decoration: underline;
  text-decoration-color: var(--primary-purple);
  text-underline-offset: 4px;
}

.text-link:hover {
  color: var(--purple-deep);
}

.snapshot-line {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-top: 22px;
  color: var(--quiet);
  font-size: 10.5px;
}

.snapshot-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--green);
}

.metric-ledger {
  display: grid;
  min-height: 154px;
  grid-template-columns: 1.3fr 1fr 1fr;
  background: var(--surface);
  border-top: 1px solid var(--ink);
  border-bottom: 1px solid var(--rule);
}

.metric-cell {
  padding: 15px 16px 13px;
  border-right: 1px solid var(--rule);
}

.metric-cell:nth-child(3) {
  border-right: 0;
}

.metric-cell:nth-child(4) {
  border-top: 1px solid var(--rule);
}

.metric-cell:nth-child(5) {
  grid-column: 2 / 4;
  border-top: 1px solid var(--rule);
  border-right: 0;
}

.metric-label {
  margin-bottom: 9px;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.25;
}

.metric-value {
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.06em;
  white-space: nowrap;
}

.metric-value.risk {
  color: var(--red);
}

.metric-value.recovered {
  color: var(--green);
}

.metric-meta {
  margin-top: 7px;
  color: var(--quiet);
  font-size: 9.5px;
}

.provenance {
  grid-column: 1 / -1;
  padding: 10px 16px;
  border-top: 1px solid var(--rule);
  background: var(--surface-soft);
  color: var(--quiet);
  font-size: 9.5px;
}

.distribution {
  display: grid;
  grid-template-columns: 160px minmax(230px, 1fr) auto;
  align-items: center;
  gap: 20px;
  margin-top: 25px;
  padding: 13px 0 14px;
  border-top: 1px solid var(--ink);
  border-bottom: 1px solid var(--rule);
}

.distribution-title {
  font-size: 11px;
  font-weight: 650;
}

.distribution-title span {
  display: block;
  margin-top: 2px;
  color: var(--quiet);
  font-size: 10px;
  font-weight: 400;
}

.state-bar {
  display: flex;
  height: 9px;
  overflow: hidden;
  background: var(--rule-soft);
}

.state-segment {
  min-width: 3px;
  height: 100%;
}

.legend {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 12px;
  color: var(--muted);
  font-size: 9.5px;
}

.legend-item {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
}

.legend-dot,
.action-mark,
.severity-dot {
  display: inline-block;
  border-radius: 50%;
}

.legend-dot {
  width: 7px;
  height: 7px;
}

.packet-grid {
  display: grid;
  grid-template-columns: minmax(0, 8fr) minmax(320px, 4fr);
  align-items: start;
  gap: 31px;
  margin-top: 34px;
}

.section-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--ink);
}

.section-head h3,
.aside-section h3,
.evidence-title h3,
.page-section-title {
  margin: 0;
  color: var(--ink);
  font-size: 15px;
  font-weight: 650;
  letter-spacing: -0.03em;
}

.section-head p,
.aside-section > p,
.page-section-subtitle {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 11px;
}

.count-note {
  color: var(--quiet);
  font-family: var(--font-mono);
  font-size: 10px;
  white-space: nowrap;
}

.docket-wrap,
.state-board-wrap,
.table-scroll {
  overflow-x: auto;
  border-bottom: 1px solid var(--rule);
  scrollbar-width: thin;
  scrollbar-color: var(--rule) transparent;
}

table {
  width: 100%;
  border-collapse: collapse;
}

.docket-table {
  min-width: 780px;
}

th {
  padding: 11px 9px 9px;
  border-bottom: 1px solid var(--rule);
  color: var(--quiet);
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-align: left;
  text-transform: uppercase;
}

td {
  padding: 13px 9px;
  border-bottom: 1px solid var(--rule-soft);
  color: var(--muted);
  font-size: 11px;
  vertical-align: middle;
}

tbody tr:last-child td {
  border-bottom: 0;
}

.docket-row {
  cursor: pointer;
  transition: background 150ms ease;
}

.docket-row:hover {
  background: var(--surface-soft);
}

.docket-row.selected {
  background: var(--purple-soft);
  box-shadow: inset 3px 0 0 var(--primary-purple);
}

.row-index {
  width: 30px;
  color: var(--quiet);
  font-family: var(--font-mono);
  font-size: 10px;
}

.action-name {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--ink);
  font-weight: 650;
  white-space: nowrap;
}

.action-mark {
  width: 7px;
  height: 7px;
}

.sku-line {
  display: block;
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 10.5px;
}

.location-line {
  display: block;
  margin-top: 2px;
  color: var(--quiet);
  font-size: 10px;
  white-space: nowrap;
}

.reason {
  max-width: 260px;
  line-height: 1.35;
}

.value,
.quantity {
  color: var(--ink);
  font-family: var(--font-mono);
  font-weight: 600;
  white-space: nowrap;
}

.quantity {
  font-weight: 400;
}

.review-arrow {
  width: 28px;
  color: var(--quiet);
  font-size: 16px;
  text-align: right;
}

.docket-row:hover .review-arrow,
.docket-row.selected .review-arrow {
  color: var(--primary-purple);
}

.filter-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin: 12px 0 0;
  padding: 4px 7px;
  border: 1px solid #FFFFFF;
  border-radius: var(--radius-control);
  background: var(--purple-soft);
  color: var(--purple-deep);
  font-family: var(--font-mono);
  font-size: 9.5px;
}

.filter-chip button {
  padding: 0;
  border: 0;
  background: transparent;
  color: inherit;
  cursor: pointer;
  font-size: 13px;
  line-height: 1;
}

.packet-aside {
  min-width: 0;
}

.aside-section {
  margin-bottom: 28px;
  padding-top: 12px;
  border-top: 1px solid var(--ink);
}

.constraint-list {
  border-bottom: 1px solid var(--rule);
}

.constraint {
  display: grid;
  grid-template-columns: 14px minmax(0, 1fr) auto;
  align-items: start;
  gap: 8px;
  padding: 12px 0;
  border-top: 1px solid var(--rule-soft);
}

.constraint:first-child {
  border-top: 0;
}

.severity-dot {
  width: 7px;
  height: 7px;
  margin-top: 5px;
}

.constraint-title {
  color: var(--ink);
  font-size: 11px;
  font-weight: 650;
}

.constraint-reason {
  margin-top: 3px;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.4;
}

.constraint-state {
  color: var(--quiet);
  font-size: 9px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  white-space: nowrap;
}

.inspector {
  position: sticky;
  top: 105px;
  padding: 20px 20px 18px;
  border: 1px solid var(--rule);
  border-radius: var(--radius-inspector);
  background: var(--surface);
  box-shadow: var(--shadow-inspector);
}

.inspector-top {

.inspector-kicker {

.inspector h3 {

  font-size: 18px;

}

.inspector-store {

  color: var(--muted);

}

.inspector-index {
  color: var(--quiet);
  font-family: var(--font-mono);
  font-size: 11px;
}

.inspector-impact {

}

.impact-label {

.impact-value {

  font-weight: 600;
}

.inspector-status {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 9px 0;

  font-size: 10.5px;
  font-weight: 600;
}

.inspector-status.rejected {

}

.inspector-status i {
  font-size: 14px;
}

.rationale-title {
  margin: 16px 0 2px;
  font-size: 11px;
  font-weight: 650;
}

.rationale-sub {

}

.evidence-register {

}

.evidence-row {

.evidence-label {

.evidence-value {

.evidence-value strong {

.inspector-actions {

.primary-btn,
.secondary-btn {

}

.primary-btn {

.primary-btn:hover {

}

.primary-btn.accepted {

}

.primary-btn.rejected {

}

.secondary-btn {

}

.secondary-btn:hover {

  color: var(--ink);
}

.reject-confirm {

}

.confirm-actions {

  gap: 10px;
  margin-top: 7px;
}

.confirm-actions button {

  border: 0;

  font-size: 10px;

}

.confirm-actions button.cancel {

}

.left-lower {

  gap: 24px;
  margin-top: 32px;
}

.evidence-sheet,
.record,
.page-section {
  min-width: 0;
  border-top: 1px solid var(--ink);
}

.evidence-sheet {
  padding-bottom: 13px;
  border-bottom: 1px solid var(--rule);
}

.evidence-title {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  padding: 11px 0 13px;
}

.evidence-title span {
  color: var(--quiet);
  font-size: 10px;
}

.chart-frame {
  padding: 10px 10px 7px;
  border: 1px solid var(--rule-soft);
  background: var(--surface);
}

.chart-frame svg {
  display: block;
  width: 100%;
  height: auto;
}

.chart-note {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 16px;
  margin-top: 10px;
  color: var(--muted);
  font-size: 10px;
}

.chart-note span {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.chart-key {
  display: inline-block;
  width: 15px;
  height: 2px;
  background: var(--ink);
}

.chart-key.forecast {

  border-top: 1px dashed var(--blue);
  background: transparent;
}

.chart-key.selected {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--primary-purple);
}

.readout {
  margin-top: 11px;
  padding-left: 10px;
  border-left: 2px solid var(--primary-purple);
  color: var(--muted);
  font-size: 10.5px;
  line-height: 1.45;
}

.readout strong {
  color: var(--ink);
}

.position-ledger {
  border-bottom: 1px solid var(--rule);
}

.position-row {
  display: grid;
  grid-template-columns: 1fr minmax(0, 1.1fr);
  gap: 12px;
  padding: 11px 0;
  border-bottom: 1px solid var(--rule-soft);
  color: var(--muted);
  font-size: 10.5px;
}

.position-row:last-child {
  border-bottom: 0;
}

.position-row strong {
  color: var(--ink);
  font-family: var(--font-mono);
  font-weight: 500;
  text-align: right;
}

.record {
  margin-top: 32px;
}

.record table {
  min-width: 0;
}

.record td {
  padding-top: 11px;
  padding-bottom: 11px;
}

.decision-status {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 10px;
  font-weight: 600;
}

.decision-status.accepted {
  color: var(--green);
}

.decision-status.rejected {
  color: var(--red);
}

.decision-status i {
  font-size: 13px;
}

.state-board-wrap {
  margin-top: 0;
}

.state-table {
  min-width: 980px;
}

.state-table th,
.state-table td {
  white-space: nowrap;
}

.state-table th:first-child,
.state-table td:first-child {
  position: sticky;
  left: 0;
  z-index: 2;
  min-width: 182px;
  background: var(--surface);
}

.state-table th:first-child {
  z-index: 3;
}

.state-table tbody tr:hover td:first-child {
  background: var(--surface-soft);
}

.store-name {
  color: var(--ink);
  font-weight: 600;
}

.store cluster {
  display: block;
  margin-top: 2px;
  color: var(--quiet);
  font-size: 9.5px;
}

.state-cell {
  display: block;
  width: 100%;
  min-width: 72px;
  height: 31px;
  padding: 0 7px;
  border: 2px solid transparent;
  border-radius: 4px;
  color: #fff;
  cursor: pointer;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  line-height: 27px;
  text-align: center;
  transition: border-color 150ms ease, filter 150ms ease;
}

.state-cell:hover,
.state-cell.selected {
  border-color: var(--primary-purple);
  filter: saturate(1.12);
}

.state-cell.quiet {
  color: #D04A02;
  opacity: 0.52;
}

.state-cell.state-OUT { background: var(--red); }
.state-cell.state-BLOCKED { background: var(--graphite); }
.state-cell.state-RISK { background: var(--amber); }
.state-cell.state-BREAKOUT { background: var(--violet); }
.state-cell.state-TERMINAL { background: #D04A02; }
.state-cell.state-IMBAL { background: var(--blue); }
.state-cell.state-SLOW { background: #D04A02; }
.state-cell.state-HEALTHY { background: var(--green); }

.board-legend {
  justify-content: flex-start;
  padding: 12px 9px 3px;
}

.page-section {
  margin-top: 30px;
  padding-top: 12px;
}

.page-section + .page-section {
  margin-top: 35px;
}

.page-section-header {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 14px;
}

.page-section-header > div:first-child p {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 11px;
}

.page-section-header > .mono {
  color: var(--quiet);
  font-size: 10px;
  white-space: nowrap;
}

.page-grid-2 {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(300px, 0.72fr);
  gap: 24px;
}

.page-grid-3 {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}

.rule-panel {
  min-width: 0;
  padding: 16px 0 0;
  border-top: 1px solid var(--rule);
}

.rule-panel h4 {
  margin: 0;
  font-size: 12px;
  font-weight: 650;
}

.rule-panel p {
  margin: 4px 0 14px;
  color: var(--muted);
  font-size: 10.5px;
}

.bar-list {
  display: grid;
  gap: 11px;
}

.bar-row {
  display: grid;
  grid-template-columns: 132px minmax(0, 1fr) 72px;
  align-items: center;
  gap: 10px;
  color: var(--muted);
  font-size: 10.5px;
}

.bar-track {
  height: 8px;
  overflow: hidden;
  background: var(--rule-soft);
}

.bar-fill {
  height: 100%;
  background: var(--blue);
}

.bar-fill.green { background: var(--green); }
.bar-fill.amber { background: var(--amber); }
.bar-fill.red { background: var(--red); }
.bar-fill.graphite { background: var(--graphite); }

.bar-value {
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 10px;
  text-align: right;
  white-space: nowrap;
}

.kv-list {
  border-top: 1px solid var(--rule-soft);
}

.kv-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--rule-soft);
  color: var(--muted);
  font-size: 11px;
}

.kv-row strong {
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  text-align: right;
}

.empty-state {
  padding: 22px 0;
  color: var(--muted);
  font-size: 12px;
}

.empty-state strong {
  display: block;
  margin-bottom: 4px;
  color: var(--ink);
  font-size: 13px;
}

.scenario-page-note {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  margin: 0 0 24px;
  padding: 12px 14px;
  border-left: 2px solid var(--primary-purple);
  background: var(--purple-soft);
  color: var(--muted);
  font-size: 11px;
}

.scenario-page-note i {
  color: var(--primary-purple);
  font-size: 15px;
}

.scenario-outcome {
  padding: 17px 16px;
  border-top: 1px solid var(--ink);
  border-bottom: 1px solid var(--rule);
  background: var(--surface);
}

.scenario-outcome h3 {
  margin: 0 0 5px;
  font-size: 15px;
  font-weight: 650;
}

.scenario-outcome p {
  margin: 0;
  color: var(--muted);
  font-size: 11px;
}

.skeleton-line,
.skeleton-block {
  position: relative;
  overflow: hidden;
  background: #FFFFFF;
}

.skeleton-line::after,
.skeleton-block::after {
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.65), transparent);
  content: "";
  animation: skeleton 1.2s ease-in-out infinite;
}

.skeleton-line {
  width: 70%;
  height: 12px;
  margin: 10px 0;
}

.skeleton-line.large {
  width: 82%;
  height: 30px;
}

.skeleton-block {
  height: 230px;
  margin-top: 20px;
}

@keyframes skeleton {
  from { transform: translateX(-100%); }
  to { transform: translateX(100%); }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

@media (max-width: 1120px) {
  :root { --sidebar-width: 208px; }
  .summary-grid { grid-template-columns: 1fr; gap: 28px; }
  .metric-ledger { max-width: none; }
  .packet-grid { grid-template-columns: 1fr; }
  .packet-aside { display: grid; grid-template-columns: 1fr 1.2fr; gap: 25px; }
  .aside-section { margin-bottom: 0; }
  .inspector { position: relative; top: auto; }
  .content { padding-inline: 27px; }
  .topbar { padding-inline: 27px; }
}

@media (max-width: 820px) {
  .page-grid-2,
  .page-grid-3 { grid-template-columns: 1fr; }
  .left-lower { grid-template-columns: 1fr; }
  .bar-row { grid-template-columns: 110px minmax(0, 1fr) 65px; }
}

@media (max-width: 760px) {
  :root { --sidebar-width: 58px; }
  .sidebar {
    width: 58px;
    flex-basis: 58px;
    padding: 18px 8px;
    transition: width 180ms ease, flex-basis 180ms ease;
  }
  .sidebar.is-expanded {
    width: 280px;
    flex-basis: 280px;
  }
  .brand {
    justify-content: center;
    padding: 0 5px 22px;
  }
  .brand-name,
  .brand-sub,
  .nav-label,
  .nav-item span,
  .profile strong,
  .profile span { display: none; }
  .brand-mark { width: 30px; }
  .nav-item {
    justify-content: center;
    padding: 10px 0;
    border-left: 0;
    border-bottom: 2px solid transparent;
  }
  .nav-item.active {
    border-bottom-color: var(--primary-purple);
  }
  .nav-item i { font-size: 17px; }
  .nav-count { display: none; }
  .sidebar-bottom { padding-top: 10px; }
  .utility-item { padding: 9px 0; }
  .profile { justify-content: center; padding: 12px 0 0; }
  .sidebar.is-expanded .brand {
    justify-content: flex-start;
    padding-inline: 9px;
  }
  .sidebar.is-expanded .brand-name,
  .sidebar.is-expanded .brand-sub,
  .sidebar.is-expanded .nav-label,
  .sidebar.is-expanded .nav-item span,
  .sidebar.is-expanded .profile strong,
  .sidebar.is-expanded .profile span { display: block; }
  .sidebar.is-expanded .nav-item {
    justify-content: flex-start;
    padding: 9px 10px;
    border-bottom: 0;
    border-left: 2px solid transparent;
  }
  .sidebar.is-expanded .nav-item.active { border-left-color: var(--primary-purple); }
  .sidebar.is-expanded .nav-count { display: block; }
  .sidebar.is-expanded .profile { justify-content: flex-start; }
  .scenario-rail { display: none; }
  .sidebar.is-expanded .scenario-rail { display: block; }
  .topbar {
    min-height: 76px;
    padding: 14px 18px;
  }
  .header-actions { gap: 8px; }
  .mobile-nav-toggle { display: block; }
  .updated,
  .header-profile span { display: none; }
  .content { padding: 22px 18px 42px; }
  .page-title { font-size: 18px; }
  .page-subtitle { font-size: 10px; }
  .scenario-trigger { font-size: 10px; }
  .summary-grid { gap: 24px; }
  .conclusion h2 { font-size: 25px; }
  .metric-ledger { grid-template-columns: 1fr 1fr; }
  .metric-cell:nth-child(3) { border-right: 0; }
  .metric-cell:nth-child(4) { border-right: 1px solid var(--rule); }
  .metric-cell:nth-child(5) { grid-column: 1 / -1; }
  .distribution { grid-template-columns: 1fr; gap: 10px; }
  .legend { justify-content: flex-start; }
  .packet-grid { margin-top: 26px; }
  .packet-aside { display: flex; flex-direction: column; }
  .inspector { border-radius: 12px; }
  .header-actions .icon-action { display: none; }
  .header-actions .mobile-nav-toggle { display: block; }
}

@media (max-width: 520px) {
  .conclusion h2 { font-size: 23px; }
  .metric-value { font-size: 17px; }
  .provenance { font-size: 9px; }
  .packet-grid { display: flex; flex-direction: column; }
  .packet-main { order: 2; }
  .packet-aside { order: 1; }
  .section-head { align-items: flex-start; }
  .section-head h3 { font-size: 14px; }
  .inspector-actions { flex-direction: column; }
  .secondary-btn { min-height: 34px; }
  .left-lower { margin-top: 24px; }
  .record { margin-top: 25px; }
}


/* ==========================================================================
   2. Workstream 1 components (merged from the design module stylesheet)
   ========================================================================== */
/* ==========================================================================
   Workstream 1 · Trend to Design Accelerator
   Additional components layered on the control tower design language.
   ========================================================================== */

.ws-controls {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--radius-card);
  padding: var(--space-3);
  display: grid;
  gap: var(--space-3);
  margin-bottom: var(--space-3);
}

.ws-controls-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: var(--space-2);
  flex-wrap: wrap;
}

.ws-controls-head h4 {
  margin: 0;
  font-size: 13px;
  letter-spacing: 0.01em;
}

.ws-controls-head p {
  margin: 3px 0 0;
  color: var(--muted);
  font-size: 11.5px;
}

.ws-control-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: var(--space-3);
}

.ws-control-block > .ws-control-label {
  display: block;
  font-family: var(--font-mono);
  font-size: 9.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--quiet);
  margin-bottom: 9px;
}

.chip-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.chip {
  border: 1px solid var(--rule);
  background: var(--surface-soft);
  color: var(--muted);
  border-radius: 999px;
  padding: 5px 11px;
  font-size: 11.5px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
}

.chip:hover {
  border-color: var(--quiet);
  color: var(--ink);
}

.chip.active {
  background: var(--ink);
  border-color: var(--ink);
  color: #fff;
}

.chip.signal.active {
  background: var(--blue-soft);
  border-color: var(--blue);
  color: var(--blue);
}

.chip.locked {
  opacity: 0.45;
  cursor: not-allowed;
}

.ws-slider {
  display: grid;
  gap: 6px;
}

.ws-slider input[type="range"] {
  width: 100%;
}

.ws-slider-value {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: 11.5px;
  color: var(--muted);
}

.ws-slider-value strong {
  color: var(--ink);
  font-size: 12.5px;
}

.ws-headline {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 1px;
  background: var(--rule-soft);
  border: 1px solid var(--rule);
  border-radius: var(--radius-card);
  overflow: hidden;
  margin-bottom: var(--space-3);
}

.ws-headline-cell {
  background: var(--surface);
  padding: 15px 17px;
}

.ws-headline-cell .metric-label {
  margin-bottom: 5px;
}

.ws-headline-cell .metric-value {
  font-size: 21px;
}

.ws-headline-cell .metric-value.pass {
  color: var(--green);
}

.ws-headline-cell .metric-value.miss {
  color: var(--red);
}

.ws-gate {
  border: 1px solid var(--rule);
  border-radius: var(--radius-card);
  background: var(--surface);
  padding: var(--space-3);
  display: grid;
  gap: 11px;
}

.ws-gate-track {
  position: relative;
  height: 30px;
  background: var(--rule-soft);
  border-radius: 4px;
  overflow: hidden;
}

.ws-gate-fill {
  position: absolute;
  inset: 0 auto 0 0;
  background: var(--primary-purple);
  display: flex;
  align-items: center;
  padding-left: 11px;
  color: #fff;
  font-size: 11.5px;
  font-weight: 600;
  transition: width 0.25s ease, background 0.25s ease;
}

.ws-gate-fill.pass {
  background: var(--green);
}

.ws-gate-mark {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--ink);
}

.ws-gate-mark span {
  position: absolute;
  top: -19px;
  left: 4px;
  font-family: var(--font-mono);
  font-size: 9.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink);
  white-space: nowrap;
}

.stage-flow {
  display: grid;
  gap: 1px;
  background: var(--rule-soft);
  border: 1px solid var(--rule);
  border-radius: var(--radius-card);
  overflow: hidden;
}

.stage-row {
  background: var(--surface);
  display: grid;
  grid-template-columns: 168px 1fr 108px;
  gap: var(--space-2);
  align-items: center;
  padding: 13px 17px;
}

.stage-name strong {
  display: block;
  font-size: 12.5px;
}

.stage-name span {
  display: block;
  color: var(--quiet);
  font-size: 11px;
  margin-top: 2px;
}

.stage-bars {
  display: grid;
  gap: 5px;
}

.stage-bar {
  display: flex;
  align-items: center;
  gap: 9px;
}

.stage-bar i {
  font-family: var(--font-mono);
  font-style: normal;
  font-size: 9.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--quiet);
  width: 40px;
}

.stage-bar-track {
  flex: 1;
  height: 9px;
  background: var(--rule-soft);
  border-radius: 3px;
  overflow: hidden;
}

.stage-bar-fill {
  height: 100%;
  border-radius: 3px;
  background: var(--graphite);
  transition: width 0.25s ease;
}

.stage-bar-fill.after {
  background: var(--primary-purple);
}

.stage-bar-fill.floor {
  background: var(--blue);
}

.stage-delta {
  text-align: right;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--green);
}

.stage-delta.flat {
  color: var(--quiet);
}

.trend-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(232px, 1fr));
  gap: var(--space-2);
}

.trend-card {
  text-align: left;
  border: 1px solid var(--rule);
  background: var(--surface);
  border-radius: var(--radius-card);
  padding: 15px;
  cursor: pointer;
  display: grid;
  gap: 9px;
  transition: border-color 0.12s ease, box-shadow 0.12s ease;
}

.trend-card:hover {
  border-color: var(--quiet);
}

.trend-card.active {
  border-color: var(--primary-purple);
  box-shadow: inset 3px 0 0 var(--primary-purple);
}

.trend-card-top {
  display: flex;
  justify-content: space-between;
  gap: 9px;
  align-items: flex-start;
}

.trend-card-top strong {
  font-size: 13px;
  line-height: 1.25;
}

.trend-momentum {
  font-family: var(--font-mono);
  font-size: 11.5px;
  font-weight: 600;
  color: var(--green);
  white-space: nowrap;
}

.trend-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.trend-tag {
  font-size: 10px;
  border: 1px solid var(--rule);
  border-radius: 3px;
  padding: 2px 6px;
  color: var(--muted);
  background: var(--surface-soft);
}

.trend-tag.brand {
  border-color: var(--primary-purple);
  color: var(--primary-purple);
  background: var(--purple-soft);
}

.trend-confidence {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 11px;
  color: var(--muted);
}

.trend-confidence-track {
  flex: 1;
  height: 5px;
  background: var(--rule-soft);
  border-radius: 3px;
  overflow: hidden;
}

.trend-confidence-fill {
  height: 100%;
  background: var(--blue);
}

.brief-sheet {
  border: 1px solid var(--rule);
  border-radius: var(--radius-card);
  background: var(--surface);
  overflow: hidden;
}

.brief-head {
  padding: 15px 17px;
  border-bottom: 1px solid var(--rule-soft);
  background: var(--surface-soft);
}

.brief-head .eyebrow {
  margin-bottom: 4px;
}

.brief-head h4 {
  margin: 0;
  font-size: 14px;
}

.brief-head p {
  margin: 5px 0 0;
  color: var(--muted);
  font-size: 11.5px;
}

.brief-body {
  padding: 15px 17px;
  display: grid;
  gap: 13px;
}

.brief-block > span {
  display: block;
  font-family: var(--font-mono);
  font-size: 9.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--quiet);
  margin-bottom: 6px;
}

.brief-block ul {
  margin: 0;
  padding-left: 17px;
  display: grid;
  gap: 4px;
  font-size: 12px;
  color: var(--muted);
}

.brief-block ul strong {
  color: var(--ink);
  font-weight: 600;
}

.swatch-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.swatch {
  display: flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--rule);
  border-radius: 4px;
  padding: 4px 8px;
  font-size: 11px;
  color: var(--muted);
  background: var(--surface-soft);
}

.swatch i {
  width: 13px;
  height: 13px;
  border-radius: 3px;
  border: 1px solid rgba(208,74,2,0.14);
}

.human-gate {
  border: 1px solid var(--primary-purple);
  background: var(--purple-soft);
  border-radius: var(--radius-control);
  padding: 11px 13px;
  font-size: 11.5px;
  color: var(--purple-deep);
  display: flex;
  gap: 9px;
  align-items: flex-start;
}

.human-gate strong {
  color: var(--purple-deep);
}

.taxo-table,
.ws-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}

.taxo-table th,
.ws-table th {
  text-align: left;
  font-family: var(--font-mono);
  font-size: 9.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--quiet);
  font-weight: 500;
  padding: 9px 13px;
  border-bottom: 1px solid var(--rule);
  background: var(--surface-soft);
  white-space: nowrap;
}

.taxo-table td,
.ws-table td {
  padding: 11px 13px;
  border-bottom: 1px solid var(--rule-soft);
  vertical-align: top;
  color: var(--muted);
}

.taxo-table td strong,
.ws-table td strong {
  color: var(--ink);
  font-weight: 600;
}

.ws-table tr:last-child td,
.taxo-table tr:last-child td {
  border-bottom: none;
}

.ws-table-wrap {
  border: 1px solid var(--rule);
  border-radius: var(--radius-card);
  overflow: auto;
  background: var(--surface);
}

.taxo-tag {
  display: inline-block;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.04em;
  border-radius: 3px;
  padding: 2px 7px;
  white-space: nowrap;
}

.taxo-tag.automate {
  background: var(--blue-soft);
  color: var(--blue);
}

.taxo-tag.augment {
  background: var(--amber-soft);
  color: var(--amber);
}

.taxo-tag.human {
  background: var(--green-soft);
  color: var(--green);
}

.loop-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(178px, 1fr));
  gap: 1px;
  background: var(--rule-soft);
  border: 1px solid var(--rule);
  border-radius: var(--radius-card);
  overflow: hidden;
}

.loop-step {
  background: var(--surface);
  padding: 15px;
  display: grid;
  gap: 6px;
  align-content: start;
}

.loop-step .loop-index {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--primary-purple);
}

.loop-step strong {
  font-size: 12.5px;
}

.loop-step p {
  margin: 0;
  font-size: 11.5px;
  color: var(--muted);
}

.loop-step .loop-owner {
  font-size: 10.5px;
  color: var(--quiet);
  font-family: var(--font-mono);
}

.split-bar {
  display: flex;
  height: 26px;
  border-radius: 4px;
  overflow: hidden;
  border: 1px solid var(--rule);
}

.split-seg {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10.5px;
  font-weight: 600;
  color: #fff;
  min-width: 0;
  transition: flex-basis 0.25s ease;
}

.split-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 13px;
  font-size: 11px;
  color: var(--muted);
  margin-top: 9px;
}

.split-legend i {
  width: 9px;
  height: 9px;
  border-radius: 2px;
  display: inline-block;
  margin-right: 5px;
}

.brand-row {
  display: grid;
  grid-template-columns: 190px 130px 1fr 92px;
  gap: var(--space-2);
  align-items: center;
  padding: 14px 17px;
  background: var(--surface);
}

.brand-dial {
  display: flex;
  gap: 3px;
}

.brand-dial i {
  height: 8px;
  flex: 1;
  border-radius: 2px;
  background: var(--rule-soft);
}

.brand-dial i.on {
  background: var(--primary-purple);
}

.brand-dial i.cap {
  background: var(--rule);
}

.brand-cycle {
  text-align: right;
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 600;
}

.brand-cycle.pass {
  color: var(--green);
}

.brand-cycle.miss {
  color: var(--amber);
}

.wave-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: var(--space-2);
}

.wave-card {
  border: 1px solid var(--rule);
  border-radius: var(--radius-card);
  background: var(--surface);
  padding: 17px;
  display: grid;
  gap: 9px;
  align-content: start;
}

.wave-card .wave-tag {
  font-family: var(--font-mono);
  font-size: 9.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--primary-purple);
}

.wave-card h4 {
  margin: 0;
  font-size: 13.5px;
}

.wave-card ul {
  margin: 0;
  padding-left: 17px;
  display: grid;
  gap: 5px;
  font-size: 11.5px;
  color: var(--muted);
}

.alloc-row {
  display: grid;
  grid-template-columns: 1fr 96px;
  gap: var(--space-2);
  align-items: center;
  padding: 9px 0;
  border-bottom: 1px solid var(--rule-soft);
}

.alloc-row:last-child {
  border-bottom: none;
}

.alloc-label strong {
  display: block;
  font-size: 12px;
}

.alloc-label span {
  display: block;
  font-size: 11px;
  color: var(--quiet);
  margin-top: 2px;
}

.alloc-track {
  height: 7px;
  background: var(--rule-soft);
  border-radius: 3px;
  overflow: hidden;
  margin-top: 6px;
}

.alloc-fill {
  height: 100%;
  background: var(--primary-purple);
}

.alloc-value {
  text-align: right;
  font-family: var(--font-mono);
  font-size: 12.5px;
  font-weight: 600;
}

.ledger-note {
  font-size: 11px;
  color: var(--quiet);
  font-style: italic;
  margin-top: 11px;
}

.assumption-note {
  border-top: 1px solid var(--rule-soft);
  margin-top: var(--space-3);
  padding-top: 11px;
  font-size: 10.5px;
  color: var(--quiet);
  line-height: 1.5;
}

.mono-pill {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.06em;
  border: 1px solid var(--rule);
  border-radius: 3px;
  padding: 2px 6px;
  color: var(--muted);
  background: var(--surface-soft);
  white-space: nowrap;
}

.provenance-hash {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--blue);
}

@media (max-width: 980px) {
  .stage-row {
    grid-template-columns: 132px 1fr 76px;
    padding: 11px 13px;
  }

  .brand-row {
    grid-template-columns: 1fr 1fr;
    row-gap: 9px;
  }

  .brand-cycle {
    text-align: left;
  }
}


/* ==========================================================================
   3. Theme · PwC palette, darker chrome, chart surfaces
   Loaded last so it overrides the merged base stylesheet.
   ========================================================================== */

:root {
  --paper: #FFFFFF;
  --surface: #FFFFFF;
  --surface-soft: rgba(208,74,2,0.035);
  --surface-tint: rgba(208,74,2,0.075);
  --ink: #D04A02;
  --muted: rgba(208,74,2,0.78);
  --quiet: rgba(208,74,2,0.58);
  --rule: rgba(208,74,2,0.18);
  --rule-soft: rgba(208,74,2,0.10);

  --primary-purple: #D04A02;
  --purple-soft: rgba(208,74,2,0.075);
  --purple-deep: #D04A02;
  --tangerine: rgba(208,74,2,0.78);
  --yellow: rgba(208,74,2,0.58);
  --rose: #D04A02;
  --burgundy: #D04A02;

  --red: #D04A02;
  --red-soft: rgba(208,74,2,0.075);
  --amber: rgba(208,74,2,0.78);
  --amber-soft: rgba(208,74,2,0.075);
  --green: #D04A02;
  --green-soft: rgba(208,74,2,0.075);
  --blue: #D04A02;
  --blue-soft: rgba(208,74,2,0.075);
  --violet: #D04A02;
  --graphite: rgba(208,74,2,0.72);

  --nav: #FFFFFF;
  --nav-soft: rgba(208,74,2,0.035);
  --nav-text: rgba(208,74,2,0.72);
  --shadow-inspector: 0 14px 34px rgba(208,74,2,0.12);
}

body {
  background: var(--paper);
}

/* ---------------------------------------------------------- navigation -- */

.sidebar {
  background: var(--nav);
  border-right: 0;
}

.sidebar .brand-name,
.sidebar .profile strong {
  color: #fff;
}

.sidebar .brand-sub,
.sidebar .nav-label,
.sidebar .profile span,
.sidebar .rail-kicker {
  color: #D04A02;
}

.brand-mark {
  border-color: transparent;
  background: var(--primary-purple);
  color: #fff;
}

.brand-mark::after {
  background: var(--yellow);
}

.nav-item {
  color: var(--nav-text);
  border-radius: 0 4px 4px 0;
}

.nav-item i {
  color: #D04A02;
}

.nav-item:hover {
  background: var(--nav-soft);
  color: #fff;
}

.nav-item:hover i {
  color: var(--tangerine);
}

.nav-item.active {
  background: linear-gradient(90deg, rgba(208,74,2,0.32), rgba(208,74,2,0.08));
  border-left-color: var(--primary-purple);
  color: #fff;
}

.nav-item.active i {
  color: var(--yellow);
}

.nav-count {
  color: var(--yellow);
}

.sidebar-bottom,
.sidebar .profile {
  border-top-color: #D04A02;
}

.sidebar .avatar {
  background: var(--primary-purple);
}

/* the scenario and workstream rails sit inside the dark sidebar */

.scenario-rail,
.ws-rail {
  margin-top: 22px;
  padding: 14px 10px;
  border: 1px solid #D04A02;
  border-radius: 6px;
  background: var(--nav-soft);
}

.scenario-rail h2,
.ws-rail h2 {
  color: #fff;
  font-size: 11.5px;
  margin: 0;
}

.scenario-rail p,
.ws-rail p {
  color: #D04A02;
  font-size: 10.5px;
  margin: 3px 0 0;
}

.scenario-rail .lever-top span,
.ws-rail .ws-control-label {
  color: #D04A02;
}

.scenario-rail .lever-top strong {
  color: #fff;
}

.scenario-rail .preset {
  border-color: #D04A02;
  background: #D04A02;
  color: var(--nav-text);
}

.scenario-rail .preset strong {
  color: #fff;
}

.scenario-rail .preset.active {
  border-color: var(--primary-purple);
  background: rgba(208,74,2,0.18);
}

.scenario-toggle {
  color: var(--nav-text);
}

/* ------------------------------------------------------------- topbar -- */

.topbar {
  background: linear-gradient(180deg, var(--surface-tint), var(--paper));
  border-bottom: 1px solid var(--rule);
}

.page-title {
  letter-spacing: -0.015em;
}

.page-kicker {
  color: var(--primary-purple);
}

.content {
  background: var(--paper);
}

/* --------------------------------------------------------- components -- */

.rule-panel,
.evidence-sheet,
.record,
.ws-controls,
.ws-gate,
.wave-card,
.trend-card,
.brief-sheet,
.ws-table-wrap,
.stage-flow,
.loop-grid,
.ws-headline {
  box-shadow: 0 1px 2px rgba(208,74,2,0.04);
}

.rule-panel > h4:first-child,
.viz-card > h4:first-child {
  position: relative;
  padding-left: 11px;
}

.rule-panel > h4:first-child::before,
.viz-card > h4:first-child::before {
  position: absolute;
  top: 2px;
  bottom: 2px;
  left: 0;
  width: 3px;
  border-radius: 2px;
  background: var(--primary-purple);
  content: "";
}

.metric-ledger,
.ws-headline {
  background: var(--rule);
}

.ws-headline-cell:first-child {
  background: linear-gradient(160deg, var(--surface-tint), var(--surface));
}

.metric-value.pass {
  color: var(--green);
}

.metric-value.miss {
  color: var(--rose);
}

.page-section-title,
.section-head h3 {
  letter-spacing: -0.01em;
}

.eyebrow,
.wave-tag {
  color: var(--primary-purple);
}

/* range inputs pick up the brand colour instead of the browser default */

input[type="range"] {
  accent-color: var(--primary-purple);
  height: 18px;
  background: transparent;
}

.ws-rail input[type="range"],
.scenario-rail input[type="range"] {
  accent-color: var(--tangerine);
}

/* chips */

.chip {
  background: var(--surface);
  border-color: var(--rule);
}

.chip.active {
  background: var(--primary-purple);
  border-color: var(--primary-purple);
  color: #fff;
}

.chip.signal.active {
  background: var(--surface-tint);
  border-color: var(--tangerine);
  color: var(--purple-deep);
}

.ws-rail .chip {
  background: #D04A02;
  border-color: #D04A02;
  color: var(--nav-text);
  padding: 4px 9px;
  font-size: 10.5px;
}

.ws-rail .chip:hover {
  color: #fff;
  border-color: #D04A02;
}

.ws-rail .chip.active {
  background: var(--primary-purple);
  border-color: var(--primary-purple);
  color: #fff;
}

.ws-rail .chip.signal.active {
  background: rgba(208,74,2,0.20);
  border-color: var(--tangerine);
  color: var(--yellow);
}

/* the AI involvement control: label above, note below, no collisions */

.ws-rail-block {
  margin-bottom: 16px;
}

.ws-rail-block:last-child {
  margin-bottom: 0;
}

.ws-control-label {
  display: block;
  margin-bottom: 7px;
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.ws-level {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 2px;
}

.ws-level strong {
  color: #fff;
  font-size: 12px;
}

.ws-level span {
  color: var(--yellow);
  font-family: var(--font-mono);
  font-size: 9.5px;
}

.ws-note {
  margin-top: 5px;
  color: #D04A02;
  font-size: 10px;
  line-height: 1.4;
}

.ws-rail .human-gate {
  margin-top: 12px;
  padding: 9px 10px;
  border-color: rgba(208,74,2,0.40);
  background: rgba(208,74,2,0.12);
  color: var(--yellow);
  font-size: 10.5px;
}

.ws-rail .human-gate strong {
  color: var(--yellow);
}

/* ------------------------------------------------------------- charts -- */

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: var(--space-2);
}

.viz-card {
  padding: 17px;
  border: 1px solid var(--rule);
  border-radius: var(--radius-card);
  background: var(--surface);
  box-shadow: 0 1px 2px rgba(208,74,2,0.04);
}

.viz-card h4 {
  margin: 0 0 3px;
  font-size: 13px;
}

.viz-card p {
  margin: 0 0 13px;
  color: var(--muted);
  font-size: 11.5px;
}

.viz-card.tinted {
  background: linear-gradient(165deg, var(--surface-tint), var(--surface) 62%);
}

.viz-card svg {
  display: block;
  width: 100%;
  height: auto;
  overflow: visible;
}

.viz-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 14px;
  margin-top: 12px;
  font-size: 10.5px;
  color: var(--muted);
}

.viz-legend i {
  display: inline-block;
  width: 9px;
  height: 9px;
  margin-right: 5px;
  border-radius: 2px;
}

.viz-caption {
  margin-top: 11px;
  padding-top: 9px;
  border-top: 1px solid var(--rule-soft);
  font-size: 11px;
  color: var(--muted);
}

.viz-caption strong {
  color: var(--ink);
}

.spark {
  display: block;
  width: 100%;
  height: 26px;
}

/* state colours across board, legends and charts */

.state-OUT{background:#B91C1C}
.state-BLOCKED{background:#44403C}
.state-RISK{background:#D04A02}
.state-BREAKOUT{background:#7C3AED}
.state-TERMINAL{background:#9D174D}
.state-IMBAL{background:#0E7490}
.state-SLOW{background:#92400E}
.state-HEALTHY{background:#166534}

.bar-fill.red { background: var(--rose); }
.bar-fill.amber { background: var(--tangerine); }
.bar-fill.green { background: var(--green); }
.bar-fill.blue { background: var(--blue); }
.bar-fill.graphite { background: var(--graphite); }

.action-mark.red { background: var(--rose); }
.action-mark.amber { background: var(--tangerine); }
.action-mark.violet { background: var(--burgundy); }
.action-mark.blue { background: var(--blue); }

/* fixed-size charts (donuts) keep their intrinsic size inside a viz card */

.viz-card svg[width] {

/* risk register: index, name and control on one clean line each */

@media (max-width: 860px) {

/* ==========================================================================
   4. Presentation pass · lighter chrome, calmer spacing, card-first layout
   ========================================================================== */

:root {
  color-scheme: light;
  --paper: #FFFFFF;
  --surface: #FFFFFF;
  --surface-soft: rgba(208,74,2,0.035);
  --surface-tint: rgba(208,74,2,0.075);
  --rule: rgba(208,74,2,0.18);
  --rule-soft: rgba(208,74,2,0.10);
  --radius-card: 10px;
  --radius-control: 8px;
  --card-shadow: 0 1px 2px rgba(208,74,2,0.05), 0 4px 12px rgba(208,74,2,0.04);
}

/* the scrollbar was picking up the browser dark theme */

::-webkit-scrollbar {
  width: 11px;
  height: 11px;
  background: var(--paper);
}

::-webkit-scrollbar-thumb {
  background: #D04A02;
  border: 3px solid var(--paper);
  border-radius: 8px;
}

::-webkit-scrollbar-thumb:hover {
  background: #D04A02;
}

* {
  scrollbar-color: #D04A02 var(--paper);
}

body,
.content {
  background: var(--paper);
}

/* room to breathe */

.content {
  padding: 26px 30px 56px;
}

.page-section {
  margin-bottom: 26px;
}

.page-grid-2,
.page-grid-3,
.viz-grid {
  gap: 18px;
}

.rule-panel,
.viz-card,
.evidence-sheet,
.brief-sheet,
.wave-card,
.ws-gate,
.ws-table-wrap,
.stage-flow,
.loop-grid,
.record,
.inspector {
  border-color: var(--rule);
  border-radius: var(--radius-card);
  box-shadow: var(--card-shadow);
}

.rule-panel,
.viz-card,
.ws-gate {
  padding: 20px 22px;
}

.rule-panel p,
.viz-card p {
  line-height: 1.55;
}

.readout {
  padding: 12px 14px;
  border-radius: var(--radius-control);
  line-height: 1.6;
}

.section-head,
.page-section-header {
  margin-bottom: 14px;
}

.section-head h3,
.page-section-title {
  font-size: 15px;
}

.kv-row {
  padding: 9px 0;
}

.ws-table td,
.taxo-table td {
  padding: 13px 15px;
  line-height: 1.5;
}

.ws-table th,
.taxo-table th {
  padding: 11px 15px;
}

/* KPI tiles as separate cards, the way a deck would set them */

.ws-headline,
.metric-ledger {
  gap: 14px;
  border: 0;
  background: transparent;
  box-shadow: none;
}

.ws-headline-cell,
.metric-cell {
  padding: 17px 19px;
  border: 1px solid var(--rule);
  border-radius: var(--radius-card);
  background: var(--surface);
  box-shadow: var(--card-shadow);
}

.ws-headline-cell:first-child {
  background: var(--surface);
  box-shadow: inset 0 0 0 1px rgba(208,74,2,0.18), var(--card-shadow);
}

.ws-headline-cell .metric-value,
.metric-cell .metric-value {
  font-size: 23px;
  letter-spacing: -0.02em;
}

.metric-label {
  font-size: 9.5px;
  letter-spacing: 0.13em;
}

/* ranked list charts */

.rank-head,
.rank-row {
  display: grid;
  grid-template-columns: minmax(150px, 1.5fr) minmax(140px, 2fr) 92px 78px 72px;
  gap: 14px;
  align-items: center;
}

.rank-head {
  padding: 0 10px 9px;
  border-bottom: 1px solid var(--rule);
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--quiet);
}

.rank-list {
  display: grid;
}

.rank-row {
  width: 100%;
  padding: 11px 10px;
  border: 0;
  border-bottom: 1px solid var(--rule-soft);
  border-radius: 6px;
  background: transparent;
  font: inherit;
  text-align: left;
  cursor: pointer;
  transition: background 0.12s ease;
}

.rank-row:hover {
  background: var(--surface-soft);
}

.rank-row.active {
  background: var(--surface-tint);
  box-shadow: inset 3px 0 0 var(--primary-purple);
}

.rank-name {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--ink);
}

.rank-fit {
  display: inline-block;
  margin-left: 7px;
  padding: 1px 6px;
  border-radius: 3px;
  background: var(--purple-soft);
  color: var(--purple-deep);
  font-size: 9.5px;
  font-style: normal;
  font-weight: 600;
  vertical-align: 1px;
}

.rank-track {
  position: relative;
  display: flex;
  align-items: center;
  gap: 9px;
  height: 16px;
}

.rank-fill {
  height: 10px;
  min-width: 4px;
  border-radius: 3px;
  background: var(--grey, #D04A02);
}

.rank-fill.fit {
  background: var(--primary-purple);
}

.rank-value {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
}

.rank-conf,
.rank-peak,
.rank-src {
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--muted);
}

.rank-dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  margin-right: 6px;
  border-radius: 50%;
  background: var(--green);
}

.rank-dot.low {
  background: var(--rose);
}

/* cycle-by-brand bars */

.cyc-list {
  display: grid;
  gap: 12px;
}

.cyc-row {
  display: grid;
  grid-template-columns: minmax(140px, 1fr) minmax(200px, 3fr) 110px;
  gap: 16px;
  align-items: center;
}

.cyc-name strong {
  display: block;
  font-size: 12.5px;
}

.cyc-name span {
  display: block;
  margin-top: 2px;
  color: var(--quiet);
  font-size: 10.5px;
}

.cyc-track {
  position: relative;
  height: 26px;
  border-radius: 5px;
  background: #FFFFFF;
  overflow: hidden;
}

.cyc-fill {
  position: absolute;
  inset: 0 auto 0 0;
  display: flex;
  align-items: center;
  padding-left: 11px;
  border-radius: 5px 0 0 5px;
  background: var(--primary-purple);
  color: #fff;
  font-size: 11px;
  font-weight: 600;
  transition: width 0.25s ease;
}

.cyc-fill.miss {
  background: var(--tangerine);
}

.cyc-target {
  position: absolute;
  top: -2px;
  bottom: -2px;
  width: 3px;
  background: var(--ink);
}

.cyc-verdict {
  font-size: 11px;
  font-weight: 600;
  text-align: right;
}

.cyc-verdict.ok { color: var(--green); }
.cyc-verdict.miss { color: var(--tangerine); }

.cyc-axis {
  display: flex;
  justify-content: space-between;
  padding-top: 6px;
  border-top: 1px solid var(--rule-soft);
  font-family: var(--font-mono);
  font-size: 9.5px;
  color: var(--quiet);
}

@media (max-width: 900px) {
  .rank-head { display: none; }

  .rank-row,
  .cyc-row {
    grid-template-columns: 1fr 1fr;
    row-gap: 8px;
  }
}

/* four-step process strip */

.flow-steps {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(168px, 1fr));
  gap: 12px;
}

.flow-step {
  position: relative;
  padding: 14px 15px;
  border: 1px solid var(--rule-soft);
  border-radius: var(--radius-control);
  background: var(--surface-soft);
}

.flow-step span {
  display: block;
  margin-bottom: 5px;
  color: var(--primary-purple);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
}

.flow-step strong {
  display: block;
  font-size: 12.5px;
}

.flow-step em {
  display: block;
  margin-top: 3px;
  color: var(--muted);
  font-size: 11px;
  font-style: normal;
  line-height: 1.45;
}

/* ---------------------------------------------------------------- model -- */

function wsBrand() {
  return WS_BRANDS.find((brand) => brand.id === WS.brand) || WS_BRANDS[0];
}

function wsSignalCoverage() {
  return WS_SIGNALS.reduce((sum, signal) => sum + (WS.signals[signal.id] ? signal.weight : 0), 0);
}

function wsEffectiveAutonomy(brand = wsBrand()) {
  return Math.min(WS.autonomy, brand.maxAI);
}

function wsReviewMode() {
  return WS_REVIEW_MODES.find((mode) => mode.id === WS.review) || WS_REVIEW_MODES[0];
}

function wsDriverFactor(driver, brand) {
  const autonomy = wsEffectiveAutonomy(brand) / 3;
  const coverage = wsSignalCoverage();
  if (driver === "signal") return coverage * (0.4 + 0.6 * autonomy);
  if (driver === "review") return wsReviewMode().factor * (0.55 + 0.45 * autonomy);
  return autonomy;
}

function wsCraftGuard(brand) {
  return Math.max(0.45, Math.min(1, 1.18 - brand.craft));
}

function wsStages(brand = wsBrand()) {
  const guard = wsCraftGuard(brand);
  return WS_STAGES.map((stage) => {
    const cut = stage.maxCut * wsDriverFactor(stage.driver, brand) * guard;
    const after = Math.max(stage.floor, stage.base * (1 - cut));
    return { ...stage, after, saved: stage.base - after, atFloor: after <= stage.floor + 0.01 && cut > 0 };
  });
}

function wsCycle(brand = wsBrand()) {
  const stages = wsStages(brand);
  const total = stages.reduce((sum, stage) => sum + stage.after, 0);
  const pre = stages.filter((stage) => stage.id !== "production").reduce((sum, stage) => sum + stage.after, 0);
  return { stages, total, pre, base: 14, preBase: 10, pass: total < 8 };
}

function wsTimeMix(brand = wsBrand()) {
  const guard = wsCraftGuard(brand);
  let freed = 0;
  const rows = WS_ACTIVITIES.map((activity) => {
    const reduction = activity.cut * wsDriverFactor(activity.driver, brand) * guard;
    const after = activity.share * (1 - reduction);
    freed += activity.share - after;
    return { ...activity, before: activity.share, after };
  });
  const creativeBefore = 0.37;
  const governance = freed * 0.18;
  const creative = creativeBefore + freed * 0.82;
  return { rows, creativeBefore, creative, governance, freed, pass: creative >= 0.6 };
}

function wsValue() {
  const cycle = wsCycle();
  // Case: nearly one third of approved concepts lose commercial momentum before launch,
  // and the company writes off Rs 380 Cr of markdown a year. The share of that loss caused
  // by product landing after the trend moved is what this workstream can address.
  const lateShare = 0.33;
  const designShare = 0.55;               // the rest sits with merchandising and sourcing
  const addressable = CASE.markdownLoss * lateShare;
  const curve = Math.max(0, Math.min(1, (14 - cycle.total) / (14 - 6)));
  const marginRecovered = addressable * curve * designShare;
  const revenueRecovered = marginRecovered / CASE.grossMargin;
  const mix = wsTimeMix();
  const hoursReleased = CASE.designHeadcount * 40 * (mix.creative - mix.creativeBefore) * 46;
  const fte = hoursReleased / (40 * 46);
  const budget = WS_BUDGET.reduce((sum, line) => sum + line.value, 0);
  return {
    addressable,
    marginRecovered,
    revenueRecovered,
    hoursReleased,
    fte,
    budget,
    share: budget / CASE.budget,
    ebitdaBps: (marginRecovered / CASE.revenue) * 10000,
    breakeven: wsBreakeven(budget, marginRecovered)
  };
}

function wsBreakeven(budget, runRate) {
  let spent = 0;
  let earned = 0;
  for (let month = 1; month <= 36; month += 1) {
    spent += month <= 12 ? (budget * 0.45) / 12 : month <= 24 ? (budget * 0.55) / 12 : 0;
    if (month > 3) earned += month <= 12 ? (runRate * 0.3) / 12 : runRate / 12;
    if (earned >= spent) return month;
  }
  return null;
}

function wsPortfolio() {
  const rows = WS_BRANDS.map((brand) => ({ brand, cycle: wsCycle(brand), weight: brand.collections }));
  const inScope = rows.filter((row) => row.brand.target <= 8);
  const weighted = (set) => set.reduce((sum, row) => sum + row.cycle.total * row.weight, 0) / Math.max(1, set.reduce((sum, row) => sum + row.weight, 0));
  return { rows, inScope: weighted(inScope), all: weighted(rows), inScopeCollections: inScope.reduce((sum, row) => sum + row.weight, 0) };
}

function wsFmtWeeks(weeks) {
  if (weeks >= 1) return `${weeks.toFixed(1)} wk`;
  return `${Math.round(weeks * 5)} days`;
}

function wsFmtCr(value) {
  return `₹${value.toFixed(1)} Cr`;
}

/* ------------------------------------------------------------- controls -- */

function wsControls(options = {}) {
  const brand = wsBrand();
  const effective = wsEffectiveAutonomy(brand);
  const capped = WS.autonomy > brand.maxAI;
  const autonomy = WS_AUTONOMY[effective];
  return `<section class="ws-controls" id="wsControls">
    <div class="ws-controls-head">
      <div><h4>Configure the capability</h4><p>Every panel below recalculates from these settings.</p></div>
      <span class="mono-pill">Workstream 1 · Trend to Design Accelerator</span>
    </div>
    <div class="ws-control-grid">

function wsTrendPage() {
  const brand = wsBrand();
  const active = WS_TRENDS.find((trend) => trend.id === WS.trend) || WS_TRENDS[0];
  const coverage = wsSignalCoverage();
  const cards = WS_TRENDS.map((trend) => {
    const evidence = trend.srcs.filter((source) => WS.signals[source]);
    const confidence = trend.conf * (0.45 + 0.55 * coverage) * (evidence.length / Math.max(1, trend.srcs.length));
    return { trend, confidence, evidence };
  }).sort((a, b) => b.confidence * b.trend.momentum - a.confidence * a.trend.momentum);

  const grid = cards.map(({ trend, confidence, evidence }) => `<button type="button" class="trend-card ${WS.trend === trend.id ? "active" : ""}" data-ws-trend="${trend.id}">
      <div class="trend-card-top"><strong>${escapeHTML(trend.name)}</strong><span class="trend-momentum">+${trend.momentum}%</span></div>
      <div class="trend-meta">${trend.cats.map((category) => `<span class="trend-tag">${escapeHTML(category)}</span>`).join("")}${trend.brands.includes(brand.id) ? `<span class="trend-tag brand">${escapeHTML(brand.name)} fit</span>` : ""}</div>
      ${wsSpark(wsTrendSeries(trend), trend.brands.includes(brand.id) ? PWC.purple : PWC.grey)}
      <div class="trend-confidence"><span class="mono">${trend.id}</span><span class="trend-confidence-track"><span class="trend-confidence-fill" style="width:${Math.round(confidence * 100)}%"></span></span><span>${confidence.toFixed(2)}</span></div>
      <div class="trend-confidence"><span>${evidence.length} of ${trend.srcs.length} sources · peaks in ${trend.peak} wks</span></div>
    </button>`).join("");

  const activeCard = cards.find((card) => card.trend.id === active.id) || cards[0];
  const usable = activeCard.confidence >= 0.6;

  return `${wsHeadline()}
  <section class="page-section">${wsTrendScatter(cards)}</section>
  <section class="page-section">
    <div class="page-section-header"><div><h2 class="page-section-title">Ranked for ${escapeHTML(brand.name)}</h2><p>Six source families, read every six hours, ranked for ${escapeHTML(brand.name)}.</p></div><span class="mono">${WS_TRENDS.length} live themes</span></div>
    <div class="trend-grid">${grid}</div>
  </section>
  <section class="page-grid-2">
    ${wsBriefSheet(active, activeCard.confidence, usable)}
    <div class="rule-panel">
      <h4>Signal weighting</h4>
      <p>Exhibit 1 puts this stage at three weeks, spread across disconnected sources.</p>
      ${renderBars(WS_SIGNALS.map((signal) => ({ label: signal.label, value: WS.signals[signal.id] ? Math.round(signal.weight * 100) : 0, tone: WS.signals[signal.id] ? "blue" : "graphite" })), (value) => `${value}%`)}
      <div class="readout"><strong>Sell through anchors the ranking.</strong> A loud social signal with no commercial evidence cannot lead a brief.</div>
      <div class="kv-list">
        <div class="kv-row"><span>Sweep frequency</span><strong>Every 6 hours</strong></div>
        <div class="kv-row"><span>Designer hours removed per collection</span><strong>${Math.round(1180 * wsDriverFactor("signal", brand) * 0.72)} hrs</strong></div>
        <div class="kv-row"><span>Themes surfaced per brand per month</span><strong>18 to 24</strong></div>
        <div class="kv-row"><span>Confidence floor for commitment</span><strong>0.60</strong></div>
      </div>
    </div>
  </section>
  <div class="assumption-note">Assumptions: theme set, momentum and confidence values are synthetic and illustrative, generated for this demonstration. Confidence is modelled as source confidence scaled by live signal coverage and evidence completeness. Baseline research hours of 1,180 per collection assume 1,500 people in Design &amp; Product Development, 18% of a 40-hour week on trend research (Exhibit 2) across a four-week research stage for a 40-person collection team.</div>`;
}

function wsBriefSheet(trend, confidence, usable) {
  const brand = wsBrand();
  const sources = trend.srcs.filter((source) => WS.signals[source]).map((source) => WS_SIGNALS.find((signal) => signal.id === source).label);
  const autonomy = WS_AUTONOMY[wsEffectiveAutonomy(brand)];
  return `<div class="brief-sheet">
    <div class="brief-head">
      <div class="eyebrow">Generated design brief · ${escapeHTML(trend.id)}</div>
      <h4>${escapeHTML(trend.name)} · ${escapeHTML(brand.name)}</h4>
      <p>Drafted at ${escapeHTML(autonomy.label)} level. Every line carries a source.</p>
    </div>
    <div class="brief-body">
      <div class="brief-block"><span>Evidence base</span><ul>
        <li><strong>${sources.length ? escapeHTML(sources.join(", ")) : "No live sources"}</strong> feeding this theme</li>
        <li>Momentum <strong>+${trend.momentum}%</strong> over 8 weeks, peak expected in <strong>${trend.peak} weeks</strong></li>
        <li>Confidence <strong>${confidence.toFixed(2)}</strong> ${usable ? "· above the 0.60 commitment floor" : "· below the floor, research only"}</li>
      </ul></div>
      <div class="brief-block"><span>Suggested palette</span><div class="swatch-row">${trend.palette.map(([name, hex]) => `<span class="swatch"><i style="background:${hex}"></i>${escapeHTML(name)}</span>`).join("")}</div></div>
      <div class="brief-block"><span>Commercial frame</span><ul>
        <li>Fabric direction: <strong>${escapeHTML(trend.fabric)}</strong></li>
        <li>Price architecture: <strong>${escapeHTML(trend.price)}</strong></li>
        <li>Indicative first cut: <strong>${fmtUnits(Math.round(trend.drop * (brand.rev / 0.38)))} units</strong>, deliberately short, recut on live sell through</li>

      <div class="human-gate"><i class="ti ti-user-check" aria-hidden="true"></i><span><strong>What this brief does not decide.</strong> Whether the theme belongs to the house, the silhouette, the edit, the commitment to produce. The designer records a reason code; the model learns from that.</span></div>
    </div>
  </div>`;
}

/* Keeps chart labels off each other: pushes a colliding label above or below. */
function wsLabelPlacer() {
  const placed = [];
  return function place(cx, cy, radius, text, size = 10.5) {
    const halfWidth = (text.length * size * 0.52) / 2;
    const candidates = [cy - radius - 7, cy + radius + 15, cy - radius - 21, cy + radius + 29, cy - radius - 35];
    let y = candidates[0];
    for (const option of candidates) {
      const clash = placed.some((item) => Math.abs(item.y - option) < 13 && Math.abs(item.x - cx) < item.half + halfWidth + 6);
      if (!clash) { y = option; break; }
      y = option;
    }
    placed.push({ x: cx, y, half: halfWidth });
    return y;
  };
}

function wsSpark(values, color = PWC.purple) {
  const width = 120;
  const height = 26;
  const max = Math.max(...values);
  const min = Math.min(...values);
  const points = values.map((value, index) => [
    (index / (values.length - 1)) * width,
    height - 2 - ((value - min) / Math.max(0.001, max - min)) * (height - 6)
  ]);
  const area = `${linePath(points)} L${width} ${height} L0 ${height} Z`;
  return `<svg class="spark" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" aria-hidden="true"><path d="${area}" fill="${color}" opacity="0.12"/><path d="${linePath(points)}" fill="none" stroke="${color}" stroke-width="1.6"/><circle cx="${points[points.length - 1][0] - 1}" cy="${points[points.length - 1][1]}" r="2.2" fill="${color}"/></svg>`;
}

function wsTrendSeries(trend) {
  const random = rng(trend.momentum * 97);
  let value = 100;
  return Array.from({ length: 10 }, (_, index) => {
    value *= 1 + (trend.momentum / 100) * (index / 9) * 0.28 + (random() - 0.5) * 0.05;
    return value;
  });
}

  const brand = wsBrand();

function wsBreakevenChart() {
  const value = wsValue();
  const months = 24;
  const width = 460;
  const height = 250;
  const left = 44;
  const right = 16;
  const top = 18;
  const bottom = 34;
  let spent = 0;
  let earned = 0;
  const cost = [];
  const benefit = [];
  for (let month = 1; month <= months; month += 1) {
    spent += month <= 12 ? (value.budget * 0.45) / 12 : (value.budget * 0.55) / 12;
    if (month > 3) earned += month <= 12 ? (value.marginRecovered * 0.3) / 12 : value.marginRecovered / 12;
    cost.push(spent);
    benefit.push(earned);
  }
  const max = Math.max(...cost, ...benefit, 1) * 1.1;
  const x = (month) => scale(month, 1, months, left, width - right);
  const y = (amount) => scale(amount, 0, max, height - bottom, top);
  const costPoints = cost.map((amount, index) => [x(index + 1), y(amount)]);
  const benefitPoints = benefit.map((amount, index) => [x(index + 1), y(amount)]);
  const cross = value.breakeven && value.breakeven <= months ? value.breakeven : null;
  return `<div class="viz-card tinted"><h4>Cumulative spend against benefit</h4><p>Benefit starts in month four; the lines cross ${cross ? `in month ${cross}` : "beyond month 24"}.</p>
    <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Cumulative cost and benefit by month">
      ${[0, 0.5, 1].map((step) => `<line x1="${left}" y1="${y(max * step)}" x2="${width - right}" y2="${y(max * step)}" stroke="${PWC.rule}"/><text x="${left - 7}" y="${y(max * step) + 3.5}" text-anchor="end" font-size="9.5" fill="${PWC.quiet}">₹${(max * step).toFixed(0)}</text>`).join("")}
      <path d="${linePath(benefitPoints)} L${x(months)} ${y(0)} L${x(1)} ${y(0)} Z" fill="${PWC.purple}" opacity="0.1"/>
      <path d="${linePath(costPoints)}" fill="none" stroke="${PWC.grey}" stroke-width="2.2"/>
      <path d="${linePath(benefitPoints)}" fill="none" stroke="${PWC.purple}" stroke-width="2.4"/>
      ${cross ? `<line x1="${x(cross)}" y1="${top}" x2="${x(cross)}" y2="${height - bottom}" stroke="${PWC.ink}" stroke-dasharray="4 4"/><circle cx="${x(cross)}" cy="${y(benefit[cross - 1])}" r="4.5" fill="${PWC.ink}"/><text x="${x(cross) + 7}" y="${top + 12}" font-size="10" font-weight="600" fill="${PWC.ink}">breakeven M${cross}</text>` : ""}
      <text x="${left}" y="${height - 10}" font-size="9.5" fill="${PWC.quiet}">M1</text>

function rng(seed) {
  return function random() {
    seed |= 0;
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function escapeHTML(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function fmtINR(number) {
  const value = Number(number) || 0;
  const absolute = Math.abs(value);
  const sign = value < 0 ? "-" : "";
  if (absolute >= 1e7) return `${sign}₹${(absolute / 1e7).toFixed(2)} Cr`;
  if (absolute >= 1e5) return `${sign}₹${(absolute / 1e5).toFixed(1)} L`;
  return `${sign}₹${Math.round(absolute).toLocaleString("en-IN")}`;
}

function fmtUnits(number) {
  return Math.round(Number(number) || 0).toLocaleString("en-IN");
}

function fmtPercent(number) {
  return `${Math.round(Number(number) || 0)}%`;
}

function fmtLever(key) {
  const lever = LEVERS.find((item) => item.key === key);
  return lever ? lever.format(L[key]) : String(L[key]);
}

function zOf(percent) {
  const table = { 90: 1.2816, 91: 1.3408, 92: 1.4051, 93: 1.4758, 94: 1.5548, 95: 1.6449, 96: 1.7507, 97: 1.8808, 98: 2.0537, 99: 2.3263 };
  const low = Math.floor(percent);
  const high = Math.ceil(percent);
  if (low === high) return table[low];
  return table[low] + (table[high] - table[low]) * (percent - low);
}

function elasticity(discount, eps) {
  return Math.pow(1 - discount / 100, eps);
}

function stateLabel(state) {
  return STATES[state]?.label || state;
}

function actionKey(action) {
  if (!action) return "";
  return `${action.t}|${action.c?.sku?.id}|${action.c?.store?.id}`;
}

function formatTime(date = new Date()) {
  return new Intl.DateTimeFormat("en-IN", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "Asia/Kolkata" }).format(date);
}

function snapshotAction(action) {
  if (!action) return null;
  return {
    ...action,
    c: {
      ...action.c,
      sku: { ...action.c.sku, cat: { ...action.c.sku.cat }, sup: { ...action.c.sku.sup } },
      store: { ...action.c.store }
    },
    from: action.from ? { ...action.from, sku: { ...action.from.sku, cat: { ...action.from.sku.cat } }, store: { ...action.from.store } } : null
  };
}

}
